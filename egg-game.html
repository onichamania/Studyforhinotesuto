<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>3dame</title>
<style>
  :root {
    --bg:#f2f3f5; --card:#fff; --fg:#191b1f; --sub:#7b8088;
    --line:rgba(0,0,0,.10); --shadow:0 2px 10px rgba(0,0,0,.07); --green:#35c05a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0f1114; --card:#191c21; --fg:#eef1f5; --sub:#969ca6;
      --line:rgba(255,255,255,.12); --shadow:0 2px 12px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0f1114; --card:#191c21; --fg:#eef1f5; --sub:#969ca6;
    --line:rgba(255,255,255,.12); --shadow:0 2px 12px rgba(0,0,0,.4);
  }
  * { box-sizing:border-box; }
  html, body {
    margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none; user-select:none;
  }
  .wrap { max-width:720px; margin:0 auto;
    padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 40px); }
  h1.logo { margin:0 0 20px; font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .me { display:flex; align-items:center; gap:14px; margin-bottom:26px; }
  .ring { width:86px; height:86px; border-radius:50%; flex:none; overflow:hidden;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); }
  .ring svg { display:block; width:100%; height:100%; }
  .nm { font-size:17px; font-weight:700; }
  h2.sec { margin:0 0 10px; font-size:15px; font-weight:700; }
  .games { display:flex; gap:12px; overflow-x:auto; padding-bottom:6px; }
  .game { flex:0 0 auto; width:140px; border:0; padding:0; background:none; color:inherit;
    font:inherit; text-align:left; cursor:pointer; }
  .game .icon { width:140px; height:140px; border-radius:16px; overflow:hidden;
    background:var(--card); box-shadow:var(--shadow); border:1px solid var(--line); }
  .game .icon svg { display:block; width:100%; height:100%; }
  .game .ttl { margin-top:7px; font-size:14px; font-weight:700; line-height:1.3; }
  .game:active .icon { transform:scale(.97); }
  #detail { display:none; }
  #detail.open { display:block; }
  #list.hide { display:none; }
  .back { font:inherit; font-size:14px; font-weight:700; color:var(--fg); background:var(--card);
    border:1px solid var(--line); border-radius:100px; padding:8px 16px; margin-bottom:16px;
    cursor:pointer; box-shadow:var(--shadow); }
  .head { display:flex; gap:18px; align-items:flex-start; margin-bottom:22px; }
  .head .big { width:46%; max-width:260px; flex:none; border-radius:22px; overflow:hidden;
    background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); line-height:0; }
  .head .big svg { display:block; width:100%; height:100%; }
  .head .txt { flex:1; min-width:0; }
  .head .txt h3 { margin:2px 0 8px; font-size:21px; font-weight:800; }
  .head .txt p { margin:0 0 8px; font-size:13px; line-height:1.8; color:var(--sub); }
  @media (max-width:460px) { .head { flex-direction:column; } .head .big { width:74%; max-width:none; } }
  .play { display:block; width:100%; height:76px; cursor:pointer; background:var(--card);
    border:3px solid var(--green); border-radius:38px; box-shadow:var(--shadow); }
  .play:active { background:rgba(53,192,90,.14); }
  .play svg { display:block; width:34px; height:34px; margin:0 auto; fill:var(--green); }

  #stage { position:fixed; inset:0; z-index:50; background:#000; display:none; }
  #stage.open { display:block; }
  #stage iframe { width:100%; height:100%; border:0; display:block; }
  #gear { position:fixed; z-index:60; display:none; align-items:center; justify-content:center;
    left:calc(env(safe-area-inset-left,0px) + 6px); top:calc(env(safe-area-inset-top,0px) + 6px);
    width:36px; height:36px; padding:0; border-radius:11px; font-size:17px; line-height:1;
    background:rgba(12,16,22,.6); color:#fff; border:1px solid rgba(255,255,255,.45); cursor:pointer; }
  #gear.on { display:flex; }
  #panel { position:fixed; inset:0; z-index:61; display:none; overflow-y:auto; touch-action:auto;
    background:rgba(8,12,18,.72); }
  #panel.on { display:block; }
  #panel .sheet { max-width:420px; margin:0 auto; background:var(--card); color:var(--fg);
    border-radius:0 0 18px 18px; padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 20px; }
  #panel h4 { margin:0 0 12px; font-size:18px; font-weight:800; }
  #panel .lab { font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.04em;
    margin:16px 0 7px; padding-top:12px; border-top:1px solid var(--line); }
  #panel .row { display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:5px 0; font-size:14px; }
  #panel .seg { display:flex; gap:6px; }
  #panel .seg button { font:inherit; font-size:13px; font-weight:700; padding:8px 14px;
    border-radius:9px; border:1px solid var(--line); background:transparent; color:inherit; cursor:pointer; }
  #panel .seg button.on { background:#4f7fd8; border-color:#4f7fd8; color:#fff; }
  #panel input[type="color"] { width:48px; height:30px; padding:0; border:1px solid var(--line);
    border-radius:8px; background:transparent; }
  #panel input[type="checkbox"] { width:20px; height:20px; }
  #panel .av { display:flex; gap:14px; align-items:flex-start; }
  #panel .avpic { width:96px; flex:none; border-radius:12px; overflow:hidden;
    border:1px solid var(--line); line-height:0; }
  #panel .avpic svg { display:block; width:100%; height:100%; }
  #panel .avlist { flex:1; min-width:0; }
  #panel .wide { width:100%; font:inherit; font-size:14px; font-weight:700; padding:12px;
    margin-top:10px; border-radius:11px; border:1px solid var(--line);
    background:transparent; color:inherit; cursor:pointer; }
  #panel .exit { background:#e0503c; border-color:#e0503c; color:#fff; }
  #panel .close { background:#191b1f; border-color:#191b1f; color:#fff; }
  #panel .note { font-size:11px; line-height:1.7; color:var(--sub); margin:8px 0 0; }
  .ver { margin-top:26px; display:flex; align-items:center; gap:10px;
    font-size:11px; color:var(--sub); }
  .ver button { font:inherit; font-size:11px; font-weight:700; color:var(--fg);
    background:var(--card); border:1px solid var(--line); border-radius:100px;
    padding:6px 12px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="logo">3dame</h1>
  <div id="list">
    <div class="me">
      <div class="ring" id="ring"></div>
      <div class="nm">your avater</div>
    </div>
    <h2 class="sec">ゲーム</h2>
    <div class="games" id="games"></div>
    <div class="ver">
      <span id="verText"></span>
      <button id="reloadBtn" type="button">最新に更新</button>
    </div>
  </div>
  <div id="detail">
    <button class="back" id="back">‹ もどる</button>
    <div class="head">
      <div class="big" id="bigIcon"></div>
      <div class="txt" id="bigTxt"></div>
    </div>
    <button class="play" id="play" aria-label="プレイ">
      <svg viewBox="0 0 24 24"><path d="M7 4.5 L19.5 12 L7 19.5 Z"/></svg>
    </button>
  </div>
</div>

<div id="stage"></div>
<button id="gear" aria-label="設定">⚙</button>
<div id="panel">
  <div class="sheet">
    <h4>設定</h4>
    <div class="lab" style="border-top:none;padding-top:0;margin-top:4px">FPS上限</div>
    <div class="row"><span>なめらかさ</span>
      <span class="seg" id="fpsSeg">
        <button type="button" data-fps="30">30</button>
        <button type="button" data-fps="60">60</button>
        <button type="button" data-fps="120">120</button>
      </span>
    </div>
    <p class="note">120は端末の画面が対応しているときだけ出ます。</p>
    <div class="lab">アバター</div>
    <div class="av"><div class="avpic" id="avPic"></div><div class="avlist" id="avList"></div></div>
    <button class="wide" id="avReset" type="button">色を初期に戻す</button>
    <div class="lab">ゲーム</div>
    <button class="wide exit" id="exit" type="button">ゲームから退出する</button>
    <p class="note">ホーム画面に戻ります。進み具合は保存されています。</p>
    <button class="wide close" id="panelClose" type="button">とじる</button>
  </div>
</div>

<script>

    var raw = localStorage.getItem('idle-game-settings');

      var o = JSON.parse(raw);

    document.getElementById('bigIcon').innerHTML = g.icon;
    document.getElementById('bigTxt').innerHTML =
      '<h3>' + g.title + '</h3>' + g.desc.map(function (p) { return '<p>' + p + '</p>'; }).join('');
    listEl.className = 'hide';
    detailEl.className = 'open';
    scrollTo(0, 0);
  }
  document.getElementById('back').addEventListener('click', function () {
    detailEl.className = '';
    listEl.className = '';
    scrollTo(0, 0);
  });

  function launch() {
    var g = DATA.games[current];
    var bin = atob(g.src), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var html = new TextDecoder('utf-8').decode(bytes);
    var inj = '<scr' + 'ipt>' + PLATFORM + '</scr' + 'ipt>';
    html = html.replace('<body>', '<body>' + inj);
    frame = document.createElement('iframe');
    frame.setAttribute('allow', 'autoplay; fullscreen');
    frame.srcdoc = html;
    stage.innerHTML = '';
    stage.appendChild(frame);
    stage.className = 'open';
    gear.className = 'on';
    document.body.style.overflow = 'hidden';
  }
  document.getElementById('play').addEventListener('click', launch);

  function quit() {
    stage.className = '';
    stage.innerHTML = '';
    frame = null;
    gear.className = '';
    panel.className = '';
    document.body.style.overflow = '';
  }
  document.getElementById('exit').addEventListener('click', quit);
  gear.addEventListener('click', function () { panel.className = 'on'; });
  document.getElementById('panelClose').addEventListener('click', function () { panel.className = ''; });

  // ---------------- 設定 ----------------
  var avPic = document.getElementById('avPic');
  var avList = document.getElementById('avList');
  function drawAvatar() { ringEl.innerHTML = headSVG(); avPic.innerHTML = bodySVG(); }
  var inputs = {};
  PARTS.forEach(function (p) {
    var row = document.createElement('div');
    row.className = 'row';
    var lab = document.createElement('span');
    lab.textContent = p[1];
    var inp = document.createElement('input');
    inp.type = 'color';
    inp.value = colors[p[0]];
    inp.addEventListener('input', function () {
      colors[p[0]] = inp.value; drawAvatar(); saveAvatar();
    });
    inputs[p[0]] = inp;
    row.appendChild(lab); row.appendChild(inp);
    avList.appendChild(row);
  });
  var hrow = document.createElement('div');
  hrow.className = 'row';
  var hlab = document.createElement('span');
  hlab.textContent = '髪の毛を表示';
  var hchk = document.createElement('input');
  hchk.type = 'checkbox';
  hchk.checked = hairOn;
  hchk.addEventListener('change', function () { hairOn = hchk.checked; drawAvatar(); saveAvatar(); });
  hrow.appendChild(hlab); hrow.appendChild(hchk);
  avList.appendChild(hrow);
  document.getElementById('avReset').addEventListener('click', function () {
    PARTS.forEach(function (p) { colors[p[0]] = DEF[p[0]]; inputs[p[0]].value = DEF[p[0]]; });
    hairOn = true; hchk.checked = true; drawAvatar(); saveAvatar();
  });

  var fpsBtns = document.getElementById('fpsSeg').getElementsByTagName('button');
  function drawFps() {
    for (var i = 0; i < fpsBtns.length; i++) {
      fpsBtns[i].className = (+fpsBtns[i].getAttribute('data-fps') === fps) ? 'on' : '';
    }
  }
  for (var i = 0; i < fpsBtns.length; i++) {
    (function (b) {
      b.addEventListener('click', function () {
        fps = +b.getAttribute('data-fps');
        try { localStorage.setItem('3dame-fps', String(fps)); } catch (e) {}
        if (frame && frame.contentWindow) frame.contentWindow.postMessage({ h3dFps: fps }, '*');
        drawFps();
      });
    })(fpsBtns[i]);
  }

  // ---------------- 版と更新 ----------------
  document.getElementById('verText').textContent = '版 ' + DATA.build;
  document.getElementById('reloadBtn').addEventListener('click', function () {
    var u = location.href.split('#')[0].split('?')[0];
    location.replace(u + '?v=' + Date.now());
  });

  drawAvatar();
  drawFps();
})();
</script>
</body>
</html>
