<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>卵を盗む</title>
<style>
  :root {
    --hud-bg: rgba(255,255,255,0.72);
    --hud-fg: #14181f;
    --hud-line: rgba(0,0,0,0.12);
    --pad-bg: rgba(0,0,0,0.30);
    --pad-edge: rgba(255,255,255,0.40);
    --pad-knob: rgba(0,0,0,0.52);
    --pad-knob-edge: rgba(255,255,255,0.45);
    --pad-press: rgba(0,0,0,0.52);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --hud-bg: rgba(20,24,31,0.72);
      --hud-fg: #eef2f7;
      --hud-line: rgba(255,255,255,0.16);
    }
  }
  :root[data-theme="dark"] {
    --hud-bg: rgba(20,24,31,0.72);
    --hud-fg: #eef2f7;
    --hud-line: rgba(255,255,255,0.16);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #87ceeb;
    touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #stage { position: fixed; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  #boot {
    position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center;
    background: #101317; color: #eef2f7; font-size: 14px; line-height: 1.7;
  }
  #boot.err { background: #2a1512; }
  #boot small { opacity: .6; font-size: 11px; word-break: break-all; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }

  .ui { position: fixed; pointer-events: none; }

  #hud {
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    background: var(--hud-bg); color: var(--hud-fg);
    border: 1px solid var(--hud-line); border-radius: 12px;
    padding: 5px 8px; font-size: 11px; line-height: 1.45;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    min-width: 96px;
  }
  #hud b { font-weight: 600; }
  #hud .k { opacity: .6; margin-right: 6px; }
  #hud .frame {
    border: 1.5px solid currentColor; border-radius: 8px;
    padding: 3px 7px 4px; margin-bottom: 5px; opacity: .95;
  }
  #hud .frame .k {
    display: flex; align-items: center; gap: 3px;
    font-size: 9px; margin: 0 0 1px; opacity: .65;
  }
  #hud .frame .k svg { width: 11px; height: 11px; }
  #hud .frame b { font-size: 15px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  #hud .frame b i { font-style: normal; font-size: 11px; font-weight: 500; opacity: .6; margin-left: 3px; }

  #shopUI {
    left: 0; right: 0; top: 0; bottom: 0; z-index: 30; display: none;
    overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: auto;
    background: rgba(8,12,18,.66); pointer-events: auto;
  }
  #shopUI.on { display: block; }
  #shopUI .sheet {
    max-width: 380px; margin: 0 auto; background: var(--hud-bg); color: var(--hud-fg);
    border-radius: 0 0 18px 18px; padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 20px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  #shopUI h4 { margin: 0 0 10px; font-size: 18px; font-weight: 800; }
  #shopUI .row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 13px; padding: 4px 0 10px; border-bottom: 1px solid var(--hud-line);
  }
  #shopUI .wide {
    width: 100%; font: inherit; font-size: 14px; font-weight: 700; text-align: left;
    padding: 12px 14px; margin-top: 8px; border-radius: 11px;
    border: 1px solid var(--hud-line); background: transparent; color: inherit; cursor: pointer;
  }
  #shopUI .wide small { display: block; font-size: 11px; font-weight: 500; opacity: .6; margin-top: 2px; }
  #shopUI .wide:active { background: rgba(127,127,127,.2); }
  #shopUI .close { text-align: center; background: #191b1f; border-color: #191b1f; color: #fff; }

  #hatch {
    top: calc(env(safe-area-inset-top, 0px) + 196px);
    left: calc(env(safe-area-inset-left, 0px) + 10px);
    background: var(--hud-bg); color: var(--hud-fg);
    border: 1px solid var(--hud-line); border-radius: 12px;
    padding: 7px 10px; font-size: 12px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    min-width: 150px; display: none;
  }
  #hatch.on { display: block; }
  #hatch .hd { font-size: 10px; opacity: .6; margin-bottom: 4px; }
  #hatch .r { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #hatch .r svg { width: 20px; height: 20px; flex: none; }
  #hatch .rare { font-size: 10px; font-weight: 700; color: #9aa4b0; width: 3.4em; }
  #hatch .tm { font-variant-numeric: tabular-nums; font-weight: 600; }

  #toast {
    left: 50%; transform: translateX(-50%);
    top: calc(env(safe-area-inset-top, 0px) + 18px);
    background: rgba(20,24,31,.86); color: #fff;
    border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    opacity: 0; transition: opacity .25s; white-space: nowrap;
  }
  #toast.on { opacity: 1; }

  /* 左下 バーチャルスティック（固定位置・常時表示） */
  #stick {
    left: calc(env(safe-area-inset-left, 0px) + 26px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
    width: 128px; height: 128px;
  }
  #stick .base {
    position: absolute; inset: 0; border-radius: 50%;
    background: var(--pad-bg); border: 2px solid var(--pad-edge);
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
    transition: background .08s;
  }
  #stick.active .base { background: var(--pad-press); }
  #stick .knob {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px;
    margin: -28px 0 0 -28px; border-radius: 50%;
    background: var(--pad-knob); border: 2px solid var(--pad-knob-edge);
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }

  /* 右下 ジャンプボタン */
  #jump {
    right: calc(env(safe-area-inset-right, 0px) + 30px);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 54px);
    width: 100px; height: 100px; border-radius: 50%;
    background: var(--pad-bg); border: 2px solid var(--pad-edge);
    box-shadow: 0 2px 12px rgba(0,0,0,.25);
    display: flex; align-items: center; justify-content: center;
    transition: transform .08s, background .08s;
  }
  #jump svg {
    width: 52px; height: 52px; display: block;
    fill: rgba(255,255,255,.92);
    stroke: rgba(255,255,255,.92); stroke-width: 4; stroke-linejoin: round;
    filter: drop-shadow(0 1px 3px rgba(0,0,0,.35));
  }
  #jump.press { transform: scale(.92); background: var(--pad-press); }

  #gear {
    top: calc(env(safe-area-inset-top, 0px) + 10px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--hud-bg); color: var(--hud-fg);
    border: 1px solid var(--hud-line); font-size: 19px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto; cursor: pointer;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  #settings {
    top: calc(env(safe-area-inset-top, 0px) + 60px);
    right: calc(env(safe-area-inset-right, 0px) + 10px);
    width: 250px; max-height: 66vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--hud-bg); color: var(--hud-fg);
    border: 1px solid var(--hud-line); border-radius: 14px;
    padding: 10px 12px; font-size: 13px;
    pointer-events: auto; touch-action: auto;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(0,0,0,.25);
    display: none;
  }
  #settings.open { display: block; }
  #settings .sec {
    font-size: 11px; opacity: .6; margin: 10px 0 6px; letter-spacing: .04em;
    border-top: 1px solid var(--hud-line); padding-top: 8px;
  }
  #settings .sec:first-child { border-top: none; margin-top: 2px; padding-top: 0; }
  #settings .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; padding: 4px 0;
  }
  #settings .seg { display: flex; gap: 4px; }
  #settings .seg button {
    font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 8px;
    border: 1px solid var(--hud-line); background: transparent; color: inherit; cursor: pointer;
  }
  #settings .seg button.on { background: #4f7fd8; border-color: #4f7fd8; color: #fff; }
  #settings input[type="color"] {
    width: 46px; height: 28px; padding: 0; border: 1px solid var(--hud-line);
    border-radius: 7px; background: transparent; cursor: pointer;
  }
  #settings input[type="checkbox"] { width: 18px; height: 18px; }
  #settings .wide {
    width: 100%; margin-top: 10px; font: inherit; font-size: 12px; padding: 7px;
    border-radius: 8px; border: 1px solid var(--hud-line);
    background: transparent; color: inherit; cursor: pointer;
  }

  /* インタラクト */
  #act {
    left: 0; top: 0; transform: translate(-50%, -150%);
    display: none; align-items: center; gap: 10px;
    background: rgba(24,28,34,.82); border-radius: 14px; padding: 8px 18px 8px 8px;
    pointer-events: auto; cursor: pointer;
    box-shadow: 0 4px 16px rgba(0,0,0,.35);
  }
  #act.on { display: flex; }
  #act .key {
    width: 38px; height: 38px; border-radius: 50%;
    background: #2f353d; color: #fff; font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  #act .lb { color: #fff; font-size: 16px; font-weight: 600; white-space: nowrap; }
  #act:active { background: rgba(60,68,78,.9); }

  /* 持ち物欄 */
  #bag {
    left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 178px);
    display: flex; gap: 4px; pointer-events: auto;
    max-width: 92vw; overflow-x: auto; padding: 2px;
  }
  #bag .slot {
    position: relative; width: 46px; height: 46px; border-radius: 7px;
    background: rgba(24,28,34,.7); border: 2px solid rgba(255,255,255,.35);
    cursor: pointer;
  }
  #bag .slot.sel { border-color: #ffd23f; background: rgba(60,52,24,.8); }
  #bag .slot span {
    position: absolute; left: 3px; top: 1px; font-size: 10px; color: #fff; opacity: .75;
  }
  #bag .slot svg { position: absolute; inset: 6px; width: calc(100% - 12px); height: calc(100% - 12px); }

  /* 横長のときは、左右に余裕があるので下端へ寄せる */
  #stage.land #bag { bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); }

</style>
</head>
<body>
<div id="boot">読み込み中…</div>
<div id="stage">
<div id="app"></div>

<div class="ui" id="stick"><div class="base"></div><div class="knob"></div></div>
<div class="ui" id="jump">
  <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 9 L40 27 H31.5 V39 H16.5 V27 H8 Z"/></svg>
</div>
<div class="ui" id="hud">
  <div class="frame"><span class="k">👟 増加量</span><b id="hudSteps">0</b></div>
  <div class="frame"><span class="k"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffcf3f" stroke="#c9960f" stroke-width="2"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="#dca518" stroke-width="1.6"/></svg>所持金</span><b id="hudCoin">0</b></div>
</div>
<div class="ui" id="shopUI">
  <div class="sheet">
    <h4 id="shopTitle">種売り場</h4>
    <div class="row"><span>🪙 所持金</span><b id="shopCoin">0</b></div>
    <button class="wide" data-buy="farm" id="farmBtn">農地を買う　300コイン<small>30マス植えられます／最大10か所</small></button>
    <button class="wide" data-buy="corn">とうもろこしの種　10コイン<small>3分で育ち、15コインで売れる</small></button>
    <button class="wide" data-buy="eggplant">なすの種　20コイン<small>5分で育ち、40コインで売れる</small></button>
    <button class="wide" data-buy="broccoli">ブロッコリーの種　50コイン<small>10分で育ち、150コインで売れる</small></button>
    <button class="wide" data-buy="caviar">キャビアの種　1000コイン<small>20分で育ち、2000コインで売れる</small></button>
    <button class="wide close" id="shopClose">とじる</button>
  </div>
</div>
<div class="ui" id="hatch"><div class="hd">孵化中</div><div id="hatchRows"></div></div>
<div class="ui" id="toast"></div>
<div class="ui" id="act"><div class="key">E</div><div class="lb" id="actLabel">Interact</div></div>
<div class="ui" id="bag"></div>
<button class="ui" id="gear">⚙</button>
<div class="ui" id="settings">
  <div class="sec">表示</div>
  <div class="row"><span>FPS上限</span>
    <span class="seg" id="fpsSeg">
      <button data-fps="30">30</button><button data-fps="60">60</button><button data-fps="120">120</button>
    </span>
  </div>
  <div class="row"><span>横画面</span><input type="checkbox" id="landOn"></div>
  <div class="row"><span>効果音</span><input type="checkbox" id="musicOn" checked></div>
  <div class="sec">アバター</div>
  <div class="row"><span>髪の毛を表示</span><input type="checkbox" id="hairOn" checked></div>
  <div id="colorRows"></div>
  <button class="wide" id="resetColors">色を初期に戻す</button>
</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';

  // 起動の様子を画面に出す（真っ白で止まったときに原因が分かるように）
  const bootEl = document.getElementById('boot');
  function bootFail(msg, detail) {
    if (!bootEl) return;
    bootEl.className = 'err';
    bootEl.innerHTML = msg + (detail ? '<br><small>' + String(detail) + '</small>' : '');
  }
  window.addEventListener('error', function (e) {
    bootFail('エラーで止まりました', (e.message || '') + ' ' + (e.filename || '') + ':' + (e.lineno || ''));
  });
  if (!window.THREE) { bootFail('3Dライブラリを読み込めませんでした', '通信が遮断されている可能性があります'); return; }

  // ---------------------------------------------------------------- 定数
  const GRAVITY      = 26;
  const MOVE_SPEED   = 5.2;
  const JUMP_SPEED   = 9.0;
  const AIR_CONTROL  = 0.75;
  const STEP_HEIGHT  = 0.35;  // これ以下の段差はジャンプなしで登る
  const CLIMB_SPEED  = 3.4;   // はしごを登る速さ
  const P_RADIUS     = 0.35;
  const P_HEIGHT     = 1.92;
  const EYE_Y        = 1.74;
  const DIST_MIN     = 0.0;
  const DIST_MAX     = 14.0;
  const FP_THRESHOLD = 0.9;   // これより近いと一人称
  const PITCH_LIMIT  = 1.45;

  // ---------------------------------------------------------------- 画面の向き
  let rotated = false;                       // 横画面モード
  const SW = () => rotated ? window.innerHeight : window.innerWidth;
  const SH = () => rotated ? window.innerWidth : window.innerHeight;
  function toStage(cx, cy) {
    return rotated ? { x: cy, y: window.innerWidth - cx } : { x: cx, y: cy };
  }
  function stageBox(el) {
    const r = el.getBoundingClientRect();
    return rotated
      ? { left: r.top, top: window.innerWidth - r.right, width: r.height, height: r.width }
      : { left: r.left, top: r.top, width: r.width, height: r.height };
  }
  function applyStage() {
    const st = document.getElementById('stage');
    st.style.width = SW() + 'px';
    st.style.height = SH() + 'px';
    st.style.transform = rotated ? 'rotate(90deg) translateY(-100%)' : 'none';
    st.classList.toggle('land', SW() > SH());
    resize();
  }

  // ---------------------------------------------------------------- 基本構成
  const app = document.getElementById('app');
  const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(SW(), SH());
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  app.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fc4e8);
  scene.fog = new THREE.Fog(0x8fc4e8, 45, 140);

  const camera = new THREE.PerspectiveCamera(65, SW() / SH(), 0.05, 400);
  camera.rotation.order = 'YXZ';

  const hemi = new THREE.HemisphereLight(0xdfefff, 0x6a7a68, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(18, 30, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  const sc = sun.shadow.camera;
  sc.left = -35; sc.right = 35; sc.top = 35; sc.bottom = -35; sc.near = 1; sc.far = 90;
  scene.add(sun);

  // ---------------------------------------------------------------- 地形
  const colliders = []; // {min:{x,y,z}, max:{x,y,z}}
  const ladders = [];   // よじ登れる範囲

  function addBox(x, y, z, w, h, d, color) {
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshLambertMaterial({ color: color });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(x, y + h / 2, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    colliders.push({
      min: { x: x - w / 2, y: y,     z: z - d / 2 },
      max: { x: x + w / 2, y: y + h, z: z + d / 2 }
    });
    return mesh;
  }

  // 床
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x7fa86a });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 方眼（距離感の確認用）

  // ---------------------------------------------------------------- 拠点
  const woodMat   = new THREE.MeshLambertMaterial({ color: 0x8a6a45 });
  const woodMat2  = new THREE.MeshLambertMaterial({ color: 0xa8845a });
  const metalMat  = new THREE.MeshLambertMaterial({ color: 0x59606b });
  const beltMat   = new THREE.MeshLambertMaterial({ color: 0x24282e });
  const stripeMat = new THREE.MeshLambertMaterial({ color: 0x4a515c });

  const PEN   = { x: 0, z: -8, half: 4.2, cap: 5 };
  const TREAD = { x: 8.4, z: 1.6, w: 1.9, d: 3.8, top: 0.34 };

  // 拠点の床
  addBox(0, 0, 0, 36, 0.2, 36, 0xbfae8e);

  // --- 柵 ---
  const postGeo = new THREE.BoxGeometry(0.16, 1.3, 0.16);
  function fenceRun(x1, z1, x2, z2) {
    const len = Math.hypot(x2 - x1, z2 - z1);
    if (len < 0.05) return;
    const n = Math.max(1, Math.round(len / 1.4));
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      const p = new THREE.Mesh(postGeo, woodMat);
      p.position.set(x1 + (x2 - x1) * t, 0.85, z1 + (z2 - z1) * t);
      scene.add(p);
    }
    const alongZ = Math.abs(z2 - z1) > Math.abs(x2 - x1);
    for (const y of [0.62, 1.12]) {
      const r = new THREE.Mesh(
        alongZ ? new THREE.BoxGeometry(0.08, 0.13, len) : new THREE.BoxGeometry(len, 0.13, 0.08),
        woodMat2);
      r.position.set((x1 + x2) / 2, y, (z1 + z2) / 2);
      scene.add(r);
    }
    colliders.push({
      min: { x: Math.min(x1, x2) - 0.13, y: 0.2, z: Math.min(z1, z2) - 0.13 },
      max: { x: Math.max(x1, x2) + 0.13, y: 1.5, z: Math.max(z1, z2) + 0.13 }
    });
  }
  let penFloor = null;
  (function buildPen() {
    const a = PEN.half, X = PEN.x, Z = PEN.z;
    penFloor = addBox(X, 0.2, Z, a * 2, 0.06, a * 2, 0xa3916f);   // 柵の中の地面
    fenceRun(X - a, Z - a, X + a, Z - a);
    fenceRun(X - a, Z - a, X - a, Z + a);
    fenceRun(X + a, Z - a, X + a, Z + a);
    fenceRun(X - a, Z + a, X - 1.3, Z + a);            // 手前は入口を空ける
    fenceRun(X + 1.3, Z + a, X + a, Z + a);
    // 入口の門
    for (const sx of [-1.3, 1.3]) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.2, 2.2, 0.2), woodMat);
      p.position.set(X + sx, 1.3, Z + a);
      p.castShadow = true;
      scene.add(p);
    }
    const beam = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.24, 0.22), woodMat2);
    beam.position.set(X, 2.3, Z + a);
    beam.castShadow = true;
    scene.add(beam);
  })();

  // --- ランニング機 ---
  const beltStripes = [];
  (function buildTread() {
    addBox(TREAD.x, 0.2, TREAD.z, TREAD.w, 0.14, TREAD.d, 0x3c424b);      // 台（上面 0.34）

    const R = RARITY[rarityOf(rar)];

    const body = new THREE.Mesh(eggGeo, tierMat[tierOf(tier)]);
    body.scale.set(1, 1.3, 1);
    body.castShadow = true;
    g.add(body);
    if (R.crack) {
      const cm = new THREE.MeshBasicMaterial({ color: R.crack });
      for (let c = 0; c < 3; c++) {
        const a0 = (c / 3) * Math.PI * 2 + Math.random();
        for (let m = 0; m < 3; m++) {
          const seg = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.15, 0.035), cm);
          const y = -0.14 + m * 0.14;
          const rr = 0.3 * Math.sqrt(Math.max(0.15, 1 - (y / 0.39) * (y / 0.39))) + 0.015;
          const a = a0 + (m % 2 ? 0.2 : -0.2);
          seg.position.set(Math.cos(a) * rr, y, Math.sin(a) * rr);
          seg.rotation.y = -a;
          seg.rotation.z = (m % 2 ? 0.55 : -0.55);
          g.add(seg);
        }
      }
    }
    g.scale.setScalar(R.scale);
    scene.add(g);
    return g;

  function buildNest(nest, tier, padCol) {
    const pad = new THREE.Mesh(new THREE.CircleGeometry(4.2, 24),
      new THREE.MeshLambertMaterial({ color: padCol }));
    pad.rotation.x = -Math.PI / 2;
    pad.position.set(nest.x, 0.05, nest.z);
    pad.receiveShadow = true;
    scene.add(pad);
    const list = [];
    for (let i = 0; i < 5; i++) {
      const e = { mesh: null, taken: false, tier: tier,
                  x: nest.x - 2.2 + i * 1.1, z: nest.z + 1.9 };
      setNestEgg(e, rollRarity());
      list.push(e);
    }
    return list;
  }

  // 鶏
  function makeChicken() {
    const g = new THREE.Group();
    const white = new THREE.MeshLambertMaterial({ color: 0xf6f3ea });
    const red   = new THREE.MeshLambertMaterial({ color: 0xd84b3f });
    const yel   = new THREE.MeshLambertMaterial({ color: 0xe8a33f });
    const dark  = new THREE.MeshLambertMaterial({ color: 0x20242a });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.58, 14, 12), white);
    body.scale.set(1, 0.92, 1.18); body.position.y = 0.68; body.castShadow = true;
    const tail = new THREE.Mesh(new THREE.ConeGeometry(0.3, 0.7, 6), white);
    tail.position.set(0, 0.95, 0.62); tail.rotation.x = -0.9; tail.castShadow = true;
    const neck = new THREE.Group();
    neck.position.set(0, 1.0, -0.36);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), white);
    head.position.set(0, 0.22, -0.1); head.castShadow = true;
    const comb = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.18, 0.34), red);
    comb.position.set(0, 0.46, -0.1);
    const beak = new THREE.Mesh(new THREE.ConeGeometry(0.11, 0.26, 6), yel);
    beak.position.set(0, 0.2, -0.36); beak.rotation.x = -Math.PI / 2;
    const wat = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.16, 0.1), red);
    wat.position.set(0, 0.06, -0.3);
    for (const sx of [-0.12, 0.12]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), dark);
      e.position.set(sx, 0.28, -0.24);
      neck.add(e);
    }
    neck.add(head, comb, beak, wat);
    const legs = [];
    for (const sx of [-0.18, 0.18]) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.42, 0.09), yel);
      l.position.set(sx, 0.21, 0);
      g.add(l); legs.push(l);
    }
    g.add(body, tail, neck);
    scene.add(g);
    return { mesh: g, body: body, neck: neck, legs: legs };
  }
  function makeMantis() {
    const g = new THREE.Group();
    const green = new THREE.MeshLambertMaterial({ color: 0x6fae4a });
    const green2 = new THREE.MeshLambertMaterial({ color: 0x5b9440 });
    const eyeM = new THREE.MeshLambertMaterial({ color: 0xf2e9a0 });
    const pupil = new THREE.MeshLambertMaterial({ color: 0x20242a });
    // 胴（後ろへ伸びる腹）
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.42, 12, 10), green);
    body.scale.set(1, 0.9, 2.1);
    body.position.set(0, 0.95, 0.5);
    body.castShadow = true;
    const thorax = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.8), green2);
    thorax.position.set(0, 1.02, -0.3);
    thorax.castShadow = true;
    // 頭
    const neck = new THREE.Group();
    neck.position.set(0, 1.12, -0.7);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.3, 0.34), green);
    head.castShadow = true;
    neck.add(head);
    for (const sx of [-0.19, 0.19]) {
      const e = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 8), eyeM);
      e.position.set(sx, 0.08, -0.06);
      neck.add(e);
      const pp = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), pupil);
      pp.position.set(sx * 1.1, 0.08, -0.18);
      neck.add(pp);
      const ant = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.5, 0.04), green2);
      ant.position.set(sx * 0.7, 0.36, -0.1);
      ant.rotation.x = -0.5;
      neck.add(ant);
    }
    // 鎌
    for (const sx of [-1, 1]) {
      const up = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.12), green2);
      up.position.set(sx * 0.32, 0.92, -0.55);
      up.rotation.x = 0.5;
      const bl = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.56, 0.1), green);
      bl.position.set(sx * 0.4, 0.74, -0.86);
      bl.rotation.x = -0.9;
      g.add(up, bl);
    }
    // 脚
    const legs = [];
    for (const sx of [-1, 1]) for (const sz of [0.1, 0.7]) {
      const l = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.9, 0.09), green2);
      l.position.set(sx * 0.42, 0.5, sz);
      l.rotation.z = sx * 0.35;
      g.add(l);
      legs.push(l);
    }
    g.add(body, thorax, neck);
    scene.add(g);
    return { mesh: g, body: body, neck: neck, legs: legs };
  }

  function makeCamel() {
    const g = new THREE.Group();
    const coat  = new THREE.MeshLambertMaterial({ color: 0xc0975f });
    const coat2 = new THREE.MeshLambertMaterial({ color: 0xa87f4c });
    const belly = new THREE.MeshLambertMaterial({ color: 0xd9bb8c });
    const hoof  = new THREE.MeshLambertMaterial({ color: 0x5d4a33 });
    const dark  = new THREE.MeshLambertMaterial({ color: 0x241c14 });

    // 胴（樽形）と肩・腰の膨らみ
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 16, 12), coat);
    body.scale.set(1, 1.02, 1.75);
    body.position.set(0, 1.42, 0.1);
    body.castShadow = true;
    const chest = new THREE.Mesh(new THREE.SphereGeometry(0.5, 14, 10), coat);
    chest.scale.set(1, 1.05, 1.1);
    chest.position.set(0, 1.38, -0.72);
    chest.castShadow = true;
    const rump = new THREE.Mesh(new THREE.SphereGeometry(0.48, 14, 10), coat);
    rump.scale.set(1, 1.05, 1.05);
    rump.position.set(0, 1.42, 0.92);
    const und = new THREE.Mesh(new THREE.SphereGeometry(0.5, 12, 8), belly);
    und.scale.set(0.92, 0.6, 1.6);
    und.position.set(0, 1.18, 0.1);

    // こぶ（二つ）
    const hump1 = new THREE.Mesh(new THREE.SphereGeometry(0.38, 14, 10), coat2);
    hump1.scale.set(0.9, 0.95, 0.8);
    hump1.position.set(0, 2.02, -0.28);
    hump1.castShadow = true;
    const hump2 = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 10), coat2);
    hump2.scale.set(0.9, 0.9, 0.8);
    hump2.position.set(0, 1.98, 0.6);
    hump2.castShadow = true;

    // 首と頭（前へ伸びて上を向く）
    const neck = new THREE.Group();
    neck.position.set(0, 1.62, -1.02);
    const n1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.75, 10), coat);
    n1.position.set(0, 0.3, 0.06);
    n1.rotation.x = 0.42;
    n1.castShadow = true;
    const n2 = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.6, 10), coat);
    n2.position.set(0, 0.85, -0.16);
    n2.rotation.x = -0.28;
    n2.castShadow = true;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 12, 10), coat);
    head.scale.set(1, 1, 1.3);
    head.position.set(0, 1.18, -0.3);
    head.castShadow = true;
    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.13, 10, 8), coat2);
    snout.scale.set(1, 0.85, 1.45);
    snout.position.set(0, 1.11, -0.56);
    const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.07, 0.24), coat2);
    jaw.position.set(0, 1.03, -0.5);
    neck.add(n1, n2, head, snout, jaw);
    for (const sx of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), dark);
      eye.position.set(sx * 0.12, 1.24, -0.4);
      const brow = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.03, 0.12), coat2);
      brow.position.set(sx * 0.12, 1.3, -0.4);
      const ear = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.12, 6), coat2);
      ear.position.set(sx * 0.14, 1.33, -0.16);
      ear.rotation.z = sx * 0.4;
      const nos = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 5), dark);
      nos.position.set(sx * 0.05, 1.12, -0.68);
      neck.add(eye, brow, ear, nos);
    }

    // 脚（上腿・下腿・ひづめ）
    const legs = [];
    for (const sx of [-1, 1]) for (const sz of [-0.62, 0.92]) {
      const leg = new THREE.Group();
      leg.position.set(sx * 0.36, 1.18, sz);
      const up = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.1, 0.62, 8), coat);
      up.position.y = -0.31;
      up.castShadow = true;
      const kn = new THREE.Mesh(new THREE.SphereGeometry(0.11, 8, 6), coat2);
      kn.position.y = -0.62;
      const lo = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.065, 0.5, 8), belly);
      lo.position.y = -0.88;
      const hf = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.13, 0.12, 8), hoof);
      hf.position.y = -1.16;
      leg.add(up, kn, lo, hf);
      g.add(leg);
      legs.push(leg);
    }

    // しっぽ
    const tail = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.03, 0.55, 6), coat);
    tail.position.set(0, 1.42, 1.38);
    tail.rotation.x = -0.35;
    const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), dark);
    tuft.scale.set(0.8, 1.3, 0.8);
    tuft.position.set(0, 1.18, 1.5);

    g.add(body, chest, rump, und, hump1, hump2, neck, tail, tuft);
    scene.add(g);
    return { mesh: g, body: body, neck: neck, legs: legs };
  }

  function makeRabbit() {
    const g = new THREE.Group();
    const fur  = new THREE.MeshLambertMaterial({ color: 0xf2f2f0 });
    const fur2 = new THREE.MeshLambertMaterial({ color: 0xdedede });
    const pink = new THREE.MeshLambertMaterial({ color: 0xe8a0a8 });
    const dark = new THREE.MeshLambertMaterial({ color: 0x2a2320 });
    const body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 14, 12), fur);
    body.scale.set(1, 1.05, 1.35);
    body.position.set(0, 0.78, 0.25);
    body.castShadow = true;
    const neck = new THREE.Group();
    neck.position.set(0, 1.0, -0.42);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 12), fur);
    head.scale.set(1, 0.95, 1.15);
    head.position.set(0, 0.2, -0.12);
    head.castShadow = true;
    const snout = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), fur);
    snout.position.set(0, 0.12, -0.36);
    const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), pink);
    nose.position.set(0, 0.16, -0.48);
    neck.add(head, snout, nose);
    for (const sx of [-1, 1]) {
      const ear = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.11, 0.85, 8), fur);
      ear.position.set(sx * 0.16, 0.78, -0.02);
      ear.rotation.z = sx * 0.16;
      ear.rotation.x = -0.12;
      ear.castShadow = true;
      const inn = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.06, 0.7, 8), pink);
      inn.position.set(sx * 0.17, 0.78, -0.08);
      inn.rotation.z = sx * 0.16;
      inn.rotation.x = -0.12;
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), dark);
      eye.position.set(sx * 0.21, 0.26, -0.3);
      neck.add(ear, inn, eye);
    }
    const legs = [];
    for (const sx of [-1, 1]) {                       // 後ろ足（大きい）
      const l = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8), fur2);
      l.scale.set(0.8, 0.8, 1.5);
      l.position.set(sx * 0.34, 0.24, 0.55);
      l.castShadow = true;
      g.add(l);
      legs.push(l);
    }
    for (const sx of [-1, 1]) {                       // 前足
      const l = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.5, 8), fur);
      l.position.set(sx * 0.24, 0.3, -0.28);
      g.add(l);
      legs.push(l);
    }
    const tail = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 8), fur2);
    tail.position.set(0, 0.86, 0.92);
    g.add(body, neck, tail);
    scene.add(g);
    return { mesh: g, body: body, neck: neck, legs: legs };
  }

  // ---------------------------------------------------------------- 当たり判定
  function playerBox() {
    return {
      min: { x: pos.x - P_RADIUS, y: pos.y,            z: pos.z - P_RADIUS },
      max: { x: pos.x + P_RADIUS, y: pos.y + P_HEIGHT, z: pos.z + P_RADIUS }
    };
  }
  function overlap(a, b) {
    return a.min.x < b.max.x && a.max.x > b.min.x &&
           a.min.y < b.max.y && a.max.y > b.min.y &&
           a.min.z < b.max.z && a.max.z > b.min.z;
  }
  // 低い段差なら押し戻さずに上に乗せる
  function tryStepUp(b) {
    if (!onGround && vel.y > 0.1) return false;
    const rise = b.max.y - pos.y;
    if (rise <= 0.001 || rise > STEP_HEIGHT) return false;
    const savedY = pos.y;
    pos.y = b.max.y + 0.002;
    const pb = playerBox();
    for (let i = 0; i < colliders.length; i++) {
      if (overlap(pb, colliders[i])) { pos.y = savedY; return false; }
    }
    stepOffset = Math.min(STEP_HEIGHT + 0.1, stepOffset + rise);
    if (vel.y < 0) vel.y = 0;
    onGround = true;
    return true;
  }

  function moveAxis(axis, amount) {
    if (amount === 0) return;
    pos[axis] += amount;
    for (let i = 0; i < colliders.length; i++) {
      const b = colliders[i];
      let pb = playerBox();
      if (!overlap(pb, b)) continue;
      if (axis !== 'y' && tryStepUp(b)) continue;
      pb = playerBox();
      if (amount > 0) pos[axis] -= (pb.max[axis] - b.min[axis]);
      else            pos[axis] += (b.max[axis] - pb.min[axis]);
      if (axis === 'y') {
        if (amount < 0) onGround = true;
        vel.y = 0;
      }
    }

  function startPinchIfPossible() {
    if (pinchId1 !== null) return;
    if (lookIds.length >= 2) {
      pinchId1 = lookIds[0];
      pinchId2 = lookIds[1];
      const a = lookLast[pinchId1], b = lookLast[pinchId2];
      pinchStartDist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      pinchStartCam = camDist;
    }
  }
  function endPinch() {
    pinchId1 = null; pinchId2 = null;
  }

  function fromUI(e) {
    const t = e.target;
    return !!(t && t.closest && t.closest('#settings, #gear, #bag, #act, #shopUI'));

  function onTouchStart(e) {
    if (fromUI(e)) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const q = toStage(t.clientX, t.clientY);
      const x = q.x, y = q.y;
      if (jumpId === null && inJumpZone(x, y)) {
        jumpId = t.identifier;
        jumpEl.classList.add('press');
        doJump();
      } else if (stickId === null && inStickZone(x, y)) {
        stickId = t.identifier;
        grabStick();
        updateStick(x, y);
      } else {
        lookIds.push(t.identifier);
        lookLast[t.identifier] = { x: x, y: y };
        lookStart[t.identifier] = { x: x, y: y, at: performance.now() };
        startPinchIfPossible();
      }
    }
  }

  function onTouchMove(e) {
    if (fromUI(e)) return;
    e.preventDefault();
    // ピンチ中は距離だけ更新
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      const q = toStage(t.clientX, t.clientY);
      if (lookLast[t.identifier]) {
        const prev = lookLast[t.identifier];
        if (pinchId1 === null && lookIds.indexOf(t.identifier) >= 0) {
          yaw   -= (q.x - prev.x) * 0.0055;
          pitch -= (q.y - prev.y) * 0.0055;
          pitch = Math.max(-PITCH_LIMIT, Math.min(PITCH_LIMIT, pitch));
        }
        prev.x = q.x; prev.y = q.y;
      } else if (t.identifier === stickId) {
        updateStick(q.x, q.y);
      }
    }
    if (pinchId1 !== null && lookLast[pinchId1] && lookLast[pinchId2]) {
      const a = lookLast[pinchId1], b = lookLast[pinchId2];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      // 広げる=寄る(近づく) / 縮める=引く
      camDist = pinchStartCam * (pinchStartDist / d);
      camDist = Math.max(DIST_MIN, Math.min(DIST_MAX, camDist));
    }
  }

  function onTouchEnd(e) {
    if (fromUI(e)) return;
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      const id = e.changedTouches[i].identifier;
      if (id === jumpId) { jumpId = null; jumpEl.classList.remove('press'); }
      if (id === stickId) releaseStick();
      const k = lookIds.indexOf(id);
      if (k >= 0) lookIds.splice(k, 1);
      const st0 = lookStart[id], la = lookLast[id];
      if (st0 && la && pinchId1 === null &&
          Math.hypot(la.x - st0.x, la.y - st0.y) < 12 &&
          performance.now() - st0.at < 350) {
        onTap(la.x, la.y);
      }
      delete lookStart[id];
      delete lookLast[id];
      if (id === pinchId1 || id === pinchId2) endPinch();
    }
    if (pinchId1 === null) startPinchIfPossible();
  }

  function drawBag() {

  // --- 敵（各ステージに1体ずつ） ---

  function place(E) {

  function restoreNestEgg(E, reroll) {
    for (const e of E.eggs) {

  function startTheft(E) {
    if (E.state !== 'sleep' && E.state !== 'return') return;
    for (let i = 0; i < E.carry; i++) restoreNestEgg(E);
    E.carry = 0;
    E.state = 'wake';
    E.t = 0;

  function catchPlayer(E) {
    const dx = pos.x - E.x, dz = pos.z - E.z;
    const d = Math.max(0.2, Math.hypot(dx, dz));
    vel.x = dx / d * 17; vel.z = dz / d * 17; vel.y = 8.5;
    onGround = false;
    stun = 1.0;
    let dropped = 0;
    for (let i = inv.length - 1; i >= 0; i--) {
      if (inv[i].kind === 'egg' && tierOf(inv[i].tier) === E.tier) { inv.splice(i, 1); dropped++; }
    }
    drawBag();
    E.carry = dropped;
    E.state = 'return';
    E.t = 0;
    toast(dropped ? '吹き飛ばされ、卵を取り返された' : '吹き飛ばされた');
  }
  function enemyTick(E, dt) {
    E.phase += dt;
    const gfx = E.gfx;
    const awake = E.state === 'wake' || E.state === 'chase';
    E.mark.visible = awake;
    if (awake) E.mark.position.set(E.x, 2.6 + Math.abs(Math.sin(E.phase * 6)) * 0.18, E.z);

    if (E.state === 'sleep') {
      gfx.mesh.position.y = 0;
      if (E.sit) {
        gfx.body.position.y = 0.46;
        gfx.neck.position.y = 0.72;
        gfx.legs.forEach(function (l) { l.visible = false; });
      }
      gfx.neck.rotation.x = 0.55 + Math.sin(E.phase * 1.2) * 0.06;
      return;
    }
    gfx.legs.forEach(function (l) { l.visible = true; });
    if (E.sit) { gfx.body.position.y = 0.68; gfx.neck.position.y = 1.0; }
    E.t += dt;

    if (E.state === 'wake') {                    // 1秒ためてから追いかける
      gfx.neck.rotation.x = Math.max(0, 0.55 - E.t * 1.6);
      E.yaw = Math.atan2(pos.x - E.x, pos.z - E.z) + Math.PI;
      if (E.t >= 1) { E.state = 'chase'; E.t = 0; }
      place(E);
      return;
    }

    if (E.state === 'chase') {
      const dx = pos.x - E.x, dz = pos.z - E.z;
      const d = Math.hypot(dx, dz);
      let sp = E.spd;
      if (E.willCatch) {
        const remain = Math.max(0.05, 1.5 - E.t);     // 1.5秒後に必ず追いつく
        sp = Math.max(E.spd, d / remain);
      }
      if (d > 0.01) {
        E.x += dx / d * Math.min(d, sp * dt);
        E.z += dz / d * Math.min(d, sp * dt);
        E.yaw = Math.atan2(dx, dz) + Math.PI;
      }
      if (inSafe(E.x, E.z)) {                         // 安全地帯には踏み込めない
        E.x -= dx / (d || 1) * Math.min(d, sp * dt);
        E.z -= dz / (d || 1) * Math.min(d, sp * dt);
        E.state = 'return'; E.t = 0;
        toast('逃げきった');
        place(E);
        return;
      }
      const legAng = Math.sin(E.phase * 16) * 0.6;
      for (let i = 0; i < gfx.legs.length; i++) {
        gfx.legs[i].rotation.x = (i % 2 ? -legAng : legAng);
      }
      gfx.mesh.position.y = Math.abs(Math.sin(E.phase * 16)) * 0.08;
      if (d < 1.3 || (E.willCatch && E.t >= 1.5)) { catchPlayer(E); place(E); return; }
      if (inSafe(pos.x, pos.z) || E.t > 16) {
        E.state = 'return'; E.t = 0;
        toast('逃げきった');
      }
      place(E);
      return;
    }

    // 巣へ帰る
    const dx = E.nest.x - E.x, dz = E.nest.z - E.z;
    const d = Math.hypot(dx, dz);
    if (d > 0.1) {
      E.x += dx / d * Math.min(d, E.spd * 0.8 * dt);
      E.z += dz / d * Math.min(d, E.spd * 0.8 * dt);
      E.yaw = Math.atan2(dx, dz) + Math.PI;
      const legAng = Math.sin(E.phase * 12) * 0.5;
      for (let i = 0; i < gfx.legs.length; i++) {
        gfx.legs[i].rotation.x = (i % 2 ? -legAng : legAng);
      }
    } else {
      for (let i = 0; i < E.carry; i++) restoreNestEgg(E);
      E.carry = 0;
      E.state = 'sleep';
      E.yaw = Math.PI;
    }
    place(E);
  }

  // --- 種と作物 ---
  const CROPKIND = {

  const KINDS = ['corn', 'eggplant', 'broccoli', 'caviar'];
  const stemMat = new THREE.MeshLambertMaterial({ color: 0x4f8f3c });

  function makePlant(kind) {
    const g = new THREE.Group();
    const stem = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.5, 0.06), stemMat);
    stem.position.y = 0.25;

    for (const sx of [-1, 1]) {

      l.position.set(sx * 0.11, 0.3, 0);

      g.add(l);
    }
    const fruit = new THREE.Mesh(
      kind === 'corn' ? new THREE.CylinderGeometry(0.075, 0.06, 0.26, 8)
      : kind === 'eggplant' ? new THREE.SphereGeometry(0.11, 10, 8)
      : kind === 'broccoli' ? new THREE.SphereGeometry(0.14, 10, 8)
      : new THREE.SphereGeometry(0.1, 8, 6), fruitMats[kind]);
    if (kind === 'eggplant') fruit.scale.set(1, 1.5, 1);

  function plantAt(spot, kind, t) {

  function eachPlant(fn) {

  // --- インタラクト ---
  const actEl = document.getElementById('act');
  const actLabel = document.getElementById('actLabel');
  const actV = new THREE.Vector3();
  let target = null;
  function targetAnchor(t) {
    if (t.kind === 'nest') {
      const m = ENEMIES[t.e].eggs[t.i].mesh;
      return { x: m.position.x, y: m.position.y + 0.6, z: m.position.z };
    }
    if (t.kind === 'pen') {
      const m = penItems[t.i].mesh;
      return { x: m.position.x, y: m.position.y + 0.95, z: m.position.z };
    }
    if (t.kind === 'shop') return { x: SHOP.x, y: 1.9, z: SHOP.z - 1.3 };
    if (t.kind === 'pensign') return { x: penSign.position.x, y: 2.0, z: penSign.position.z };
    if (t.kind === 'runsign') return { x: runSign.position.x, y: 2.0, z: runSign.position.z };
    if (t.kind === 'seedshop') return { x: SEEDS.x, y: 1.9, z: SEEDS.z - 1.3 };
    if (t.kind === 'cropshop') return { x: CROPS.x, y: 1.9, z: CROPS.z - 1.3 };

  function placeAct(t) {

    actEl.style.left = ((actV.x * 0.5 + 0.5) * SW()).toFixed(1) + 'px';

  function hasEgg() {
    for (let i = 0; i < inv.length; i++) if (inv[i].kind === 'egg') return true;
    return false;
  }
  function findTarget() {
    let best = null, bd = 1e9;
    const cur = inv[sel];
    if (cur && cur.kind === 'beast') {                   // 生物を売る
      const d = Math.hypot(SHOP.x - pos.x, SHOP.z - pos.z);
      if (d < 2.7) { bd = d; best = { kind: 'shop' }; }
    }
    {                                                    // 柵を広げる看板
      const d = Math.hypot(penSign.position.x - pos.x, penSign.position.z - pos.z);
      if (d < 2.2 && d < bd) { bd = d; best = { kind: 'pensign' }; }
    }
    {                                                    // ランニング機の看板
      const d = Math.hypot(runSign.position.x - pos.x, runSign.position.z - pos.z);
      if (d < 2.2 && d < bd) { bd = d; best = { kind: 'runsign' }; }
    }
    {                                                    // 種と農地を買う
      const d = Math.hypot(SEEDS.x - pos.x, SEEDS.z - pos.z);
      if (d < 2.7 && d < bd) { bd = d; best = { kind: 'seedshop' }; }
    }
    if (cropCount() > 0) {                               // 作物を売る
      const d = Math.hypot(CROPS.x - pos.x, CROPS.z - pos.z);
      if (d < 2.7 && d < bd) { bd = d; best = { kind: 'cropshop' }; }
    }
    for (let i = 0; i < farmPlots.length; i++) {         // 育った作物を収穫
      const sp = farmPlots[i].spots;
      for (let j = 0; j < sp.length; j++) {
        const pl = sp[j].plant;
        if (!pl) continue;
        const d = Math.hypot(sp[j].x - pos.x, sp[j].z - pos.z);
        if (d < 1.4 && d < bd) { bd = d; best = { kind: 'plant', p: pl }; }
      }
    }
    if (inv.length >= BAG_MAX) return best;
    if (!hasEgg()) {                                     // 卵は1つまで
      for (let e = 0; e < ENEMIES.length; e++) {
        const eggs = ENEMIES[e].eggs;
        for (let i = 0; i < eggs.length; i++) {
          if (eggs[i].taken) continue;
          const m = eggs[i].mesh.position;
          const d = Math.hypot(m.x - pos.x, m.z - pos.z);
          if (d < 1.9 && d < bd) { bd = d; best = { kind: 'nest', e: e, i: i }; }
        }
      }
    }
    for (let i = 0; i < penItems.length; i++) {
      const it = penItems[i];
      if (it.type !== 'beast') continue;                 // 置いた卵は取り出せない
      const m = it.mesh.position;
      const d = Math.hypot(m.x - pos.x, m.z - pos.z);
      if (d < 1.7 && d < bd) { bd = d; best = { kind: 'pen', i: i }; }
    }
    return best;
  }
  function cropCount() {
    let n = 0;
    for (let i = 0; i < inv.length; i++) if (inv[i].kind === 'crop') n++;
    return n;

  function cropValue() {
    let v = 0;

    }
    return v;

  function doInteract() {
    if (!target) return;
    if (target.kind === 'seedshop') { openShopUI(); return; }
    if (target.kind === 'cropshop') {
      const v = cropValue(), n = cropCount();
      if (!n) return;
      for (let i = inv.length - 1; i >= 0; i--) if (inv[i].kind === 'crop') inv.splice(i, 1);
      coins += v;
      sel = Math.max(0, Math.min(sel, inv.length - 1));
      drawBag();
      toast('作物' + n + '個を売った　+' + v + ' コイン');
      saveGame();
      return;
    }
    if (target.kind === 'plant') {
      const pl = target.p;
      if (!plantRipe(pl)) return;
      scene.remove(pl.mesh);
      pl.spot.plant = null;
      inv.push({ kind: 'crop', seed: pl.kind });
      sel = inv.length - 1;
      drawBag();
      toast(CROPKIND[pl.kind].name + 'を収穫した');
      saveGame();
      return;
    }
    if (target.kind === 'runsign') { buyRun(); return; }
    if (target.kind === 'pensign') { buyPen(); return; }
    if (target.kind === 'shop') {
      const cur = inv[sel];
      if (!cur || cur.kind !== 'beast') return;
      const price = sellPrice(cur.rar, cur.tier);
      inv.splice(sel, 1);
      coins += price;
      sel = Math.max(0, Math.min(sel, inv.length - 1));
      drawBag();
      toast(RARITY[rarityOf(cur.rar)].name + 'が売れた　+' + price + ' コイン');
      saveGame();
      return;
    }
    if (inv.length >= BAG_MAX) return;
    if (target.kind === 'nest') {
      const E = ENEMIES[target.e];
      const e = E.eggs[target.i];
      if (e.taken) return;
      e.taken = true;
      e.mesh.visible = false;
      inv.push({ kind: 'egg', t: 0, rar: e.rar, tier: E.tier });
      sel = inv.length - 1;
      drawBag();
      startTheft(E);
    } else {
      const it = penItems[target.i];
      scene.remove(it.mesh);
      penItems.splice(target.i, 1);
      inv.push({ kind: it.type === 'beast' ? 'beast' : 'egg', t: it.t, rar: it.rar, tier: it.tier });
      sel = inv.length - 1;
      drawBag();
      // 柵の中を詰め直す
      for (let i = 0; i < penItems.length; i++) {
        const p = slotPos(i);
        penItems[i].tx = p.x; penItems[i].tz = p.z;
        if (penItems[i].type === 'egg') {
          penItems[i].mesh.position.set(p.x, 0.26 + eggY(penItems[i].rar), p.z);
        }

  // --- 柵の中をタップして置く ---
  const ray = new THREE.Raycaster();

  let lastTap = 0;
  function onTap(px, py) {
    const now = performance.now();
    if (now - lastTap < 450) return;
    if (!inv[sel]) return;
    lastTap = now;
    ndc.x = (px / SW()) * 2 - 1;
    ndc.y = -(py / SH()) * 2 + 1;
    ray.setFromCamera(ndc, camera);

    // 畑に種をまく
    if (inv[sel] && inv[sel].kind === 'seed' && farmPlots.length) {
      const soils = farmPlots.map(function (f) { return f.soil; });
      const h2 = ray.intersectObjects(soils, false);
      if (h2.length) {
        const plot = farmPlots[soils.indexOf(h2[0].object)];
        let best = null, bd = 1e9;
        for (let i = 0; i < plot.spots.length; i++) {
          const sp = plot.spots[i];
          if (sp.plant) continue;
          const d = Math.hypot(sp.x - h2[0].point.x, sp.z - h2[0].point.z);
          if (d < bd) { bd = d; best = sp; }
        }
        if (!best) { toast('この農地はいっぱいです'); return; }
        const kind = inv[sel].seed;
        inv.splice(sel, 1);
        sel = Math.max(0, Math.min(sel, inv.length - 1));
        drawBag();
        plantAt(best, kind, 0);
        toast(CROPKIND[kind].name + 'を植えた');
        saveGame();
        return;
      }
    }

    const hit = ray.intersectObject(penFloor, false);
    if (!hit.length) return;
    if (Math.abs(pos.x - PEN.x) > PEN.half || Math.abs(pos.z - PEN.z) > PEN.half) {
      toast('柵の中に入ってから置いてください');
      return;
    }
    if (penItems.length >= PEN.cap) { toast('柵がいっぱいです（' + PEN.cap + 'つまで）'); return; }
    const it = inv.splice(sel, 1)[0];
    addPenItem(it.kind === 'beast' ? 'beast' : 'egg', it.t || 0, it.rar, it.tier);
    sel = Math.max(0, Math.min(sel, inv.length - 1));
    drawBag();
    toast('柵に置いた　' + penItems.length + ' / ' + PEN.cap);
    saveGame();
  }

  // --- 種売り場のUI ---
  const shopUI = document.getElementById('shopUI');
  const shopCoinEl = document.getElementById('shopCoin');
  function fmtTime(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    return m > 0 ? (m + '分' + (sec % 60) + '秒') : (sec + '秒');
  }
  const farmBtn = document.getElementById('farmBtn');
  function openShopUI() {
    shopCoinEl.textContent = Math.floor(coins).toLocaleString() +
      '　農地 ' + farmPlots.length + '/' + FARM.max;
    farmBtn.innerHTML = '農地を買う　' + Math.round(farmCost).toLocaleString() +
      'コイン<small>30マス植えられます／最大' + FARM.max + 'か所（買うたび値段は2倍）</small>';
    shopUI.classList.add('on');
  }
  document.getElementById('shopClose').addEventListener('click', function () {
    shopUI.classList.remove('on');
  });
  (function () {
    const btns = shopUI.getElementsByTagName('button');
    for (let i = 0; i < btns.length; i++) {
      const what = btns[i].getAttribute('data-buy');
      if (!what) continue;
      (function (w) {
        btns[i].addEventListener('click', function () {
          if (w === 'farm') {
            if (farmPlots.length >= FARM.max) { toast('農地はこれ以上作れません'); return; }
            if (coins < farmCost) {
              toast('コインが足りません（' + Math.round(farmCost) + '必要）'); return;
            }
            coins -= farmCost;
            farmCost *= 2;
            buildPlot(FARM_SLOTS[farmPlots.length]);
            toast('農地を作った（' + farmPlots.length + '/' + FARM.max + '）');
          } else {
            const C = CROPKIND[w];
            if (coins < C.cost) { toast('コインが足りません（' + C.cost + '必要）'); return; }
            coins -= C.cost;
            inv.push({ kind: 'seed', seed: w });
            sel = inv.length - 1;
            drawBag();
            toast(C.name + 'の種を買った');
          }
          openShopUI();
          saveGame();
        });
      })(what);
    }
  })();

  // --- 保存 ---
  function saveGame() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        speedLv: speedLv, steps: steps, coins: coins,
        runGain: runGain, runStep: runStep, runCost: runCost,
        penCap: PEN.cap, penCost: penCost, farmCost: farmCost,
        pen: penItems.map(function (it) { return { type: it.type, t: it.t, rar: it.rar, tier: it.tier }; }),
        // 卵は保存しない（持ったまま閉じても持ち越せない）。それ以外は持ち越す
        inv: inv.filter(function (it) { return it.kind !== 'egg'; })
               .map(function (it) {
                 return { kind: it.kind, t: it.t, rar: it.rar, tier: it.tier, seed: it.seed };
               }),
        farms: farmPlots.length,
        plants: (function () {
          const out = [];
          for (let i = 0; i < farmPlots.length; i++) {
            const sp = farmPlots[i].spots;
            for (let j = 0; j < sp.length; j++) {
              if (sp[j].plant) out.push({ f: i, s: j, k: sp[j].plant.kind, t: sp[j].plant.t });
            }
          }
          return out;
        })(),
        at: Date.now()
      }));
    } catch (e) {}
  }
  (function loadGame() {
    try {
      const o = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!o) return;
      if (typeof o.speedLv === 'number') speedLv = o.speedLv;
      if (typeof o.steps === 'number') steps = o.steps;
      if (typeof o.coins === 'number') coins = o.coins;
      if (typeof o.runGain === 'number') runGain = o.runGain;
      if (typeof o.runStep === 'number') runStep = o.runStep;
      if (typeof o.runCost === 'number') runCost = o.runCost;
      if (typeof o.penCap === 'number') PEN.cap = Math.max(5, o.penCap);
      if (typeof o.penCost === 'number') penCost = o.penCost;
      if (typeof o.farmCost === 'number') farmCost = o.farmCost;
      if (o.pen) o.pen.slice(0, PEN.cap).forEach(function (r) {
        addPenItem(r.type === 'beast' ? 'beast' : 'egg', r.t || 0, r.rar, r.tier);
      });
      if (o.inv) o.inv.slice(0, BAG_MAX).forEach(function (r) {
        if (r.kind === 'egg') return;                   // 卵は持ち越さない
        inv.push({ kind: r.kind, t: r.t || 0, rar: r.rar, tier: r.tier, seed: r.seed });
      });
      // 農地と作物（閉じている間も育つ）
      const away = o.at ? Math.max(0, (Date.now() - o.at) / 1000) : 0;
      const nf = Math.min(FARM.max, o.farms || 0);
      for (let i = 0; i < nf; i++) buildPlot(FARM_SLOTS[i]);
      if (o.plants) o.plants.forEach(function (r) {
        const f = farmPlots[r.f];
        if (!f || !f.spots[r.s] || !CROPKIND[r.k]) return;
        plantAt(f.spots[r.s], r.k, (r.t || 0) + away);
      });
    } catch (e) {}
  })();
  drawBag();
  refreshSigns();

  // --- 毎フレーム ---
  function gameTick(dt) {
    for (let k = 0; k < ENEMIES.length; k++) {
      const E = ENEMIES[k];
      enemyTick(E, dt);
      // 巣の卵を少しずつ戻す
      let missing = 0;
      for (const e of E.eggs) if (e.taken) missing++;
      if (missing > 0 && E.state === 'sleep') {
        E.refillT = (E.refillT || 0) + dt;
        if (E.refillT >= NEST_REFILL) { E.refillT = 0; restoreNestEgg(E, true); }
      } else E.refillT = 0;
    }

    // 柵の中身
    let beasts = 0;
    for (let i = 0; i < penItems.length; i++) {
      const it = penItems[i];
      it.t += dt;
      it.phase += dt;
      if (it.type === 'egg') {
        it.mesh.rotation.z = Math.sin(it.phase * 3) * (it.t / HATCH) * 0.35;
        if (it.label) {
          const rest = Math.max(0, Math.ceil(HATCH - it.t));
          it.label.sprite.position.set(it.mesh.position.x, 1.35, it.mesh.position.z);
          setLabel(it.label, rest + '秒', '#ffe9a8');
        }
        if (it.t >= HATCH) hatch(it);
      } else {
        beasts++;
        const rate = rateOf(it.rar, it.tier);         // 毎秒の稼ぎ
        coins += rate * dt;
        it.earn = (it.earn || 0) + dt;
        if (it.earn >= 1) {                            // 1秒ごとに毎秒の額を出す
          it.earn -= 1;
          const txt = (Math.round(rate * 100) / 100).toString();
          spawnFloat(it.mesh.position.x, it.mesh.position.y + 1.3, it.mesh.position.z,
                     '+' + txt, true);
        }
        spinAura(it.mesh, it.phase);
        it.wait -= dt;
        if (it.wait <= 0) {
          it.wait = 1.5 + Math.random() * 2.5;
          const a = Math.random() * Math.PI * 2, r = Math.random() * (PEN.half - 1.2);
          it.tx = PEN.x + Math.cos(a) * r;
          it.tz = PEN.z + Math.sin(a) * r;
        }
        const dx = it.tx - it.mesh.position.x, dz = it.tz - it.mesh.position.z;
        const d = Math.hypot(dx, dz);
        if (d > 0.08) {
          const sp = Math.min(d, dt * 1.6);
          it.mesh.position.x += dx / d * sp;
          it.mesh.position.z += dz / d * sp;
          it.mesh.rotation.y = Math.atan2(-dx, -dz);
          it.mesh.position.y = 0.26 + Math.abs(Math.sin(it.phase * 7)) * 0.12;
        } else {
          it.mesh.position.y += (0.26 - it.mesh.position.y) * Math.min(1, dt * 8);
        }
      }
    }

    // 店員のちょっとした動き
    keeperT += dt;
    const keepers = [shopKeeper, seedKeeper, cropKeeper];
    for (let k = 0; k < keepers.length; k++) {
      const kp = keepers[k];
      if (!kp) continue;
      kp.position.y = 0.2 + Math.sin(keeperT * (1.4 + k * 0.1) + k) * 0.02;
      kp.rotation.y = Math.PI + Math.sin(keeperT * (0.4 + k * 0.04) + k * 2) * 0.12;
    }

    // 作物が育つ
    eachPlant(function (pl) {
      pl.t += dt;
      const C = CROPKIND[pl.kind];
      const g = Math.min(1, pl.t / C.grow);
      const sc = 0.35 + 0.65 * g;
      pl.mesh.scale.set(sc, sc, sc);
      pl.mesh.userData.fruit.visible = g >= 1;
    });

    // 浮かぶ表示
    for (let i = floats.length - 1; i >= 0; i--) {
      const f = floats[i];
      f.t += dt;
      f.sp.position.y += dt * 0.7;
      f.sp.material.opacity = Math.max(0, 1 - f.t / 1.3);
      if (f.t >= 1.3) {
        scene.remove(f.sp);
        f.sp.material.dispose();
        floats.splice(i, 1);
      }
    }

    // ベルト
    if (runningInPlace) {
      const span = 0.44 * 8;
      beltShift = (beltShift + dt * 2.4) % span;
      for (let i = 0; i < beltStripes.length; i++) {
        beltStripes[i].position.z =
          TREAD.z - (TREAD.d - 0.5) / 2 + ((i * 0.44 + beltShift) % span);
      }
    }

    // インタラクトの表示
    target = findTarget();
    if (target) {
      actLabel.textContent =
        target.kind === 'shop' ? ('売る（+' + sellPrice((inv[sel] || {}).rar, (inv[sel] || {}).tier) + 'コイン）')
        : target.kind === 'seedshop' ? '種と農地を買う'
        : target.kind === 'cropshop' ? ('作物を売る（+' + cropValue() + 'コイン）')
        : target.kind === 'plant' ? (plantRipe(target.p) ? ('収穫する（+' + CROPKIND[target.p.kind].sell + '）')
            : (CROPKIND[target.p.kind].name + '　あと' + fmtTime(CROPKIND[target.p.kind].grow - target.p.t)))
        : target.kind === 'runsign'
            ? ('増加量を+' + runStep + '（' + Math.round(runCost) + 'コイン）')
        : target.kind === 'pensign' ? ('柵を1つ増やす（' + Math.round(penCost) + 'コイン）')
        : target.kind === 'nest' ? '卵をとる' : '持ち上げる';
      if (placeAct(target)) actEl.classList.add('on');
    } else actEl.classList.remove('on');

    // 表示
    if (toastT > 0) { toastT -= dt; if (toastT <= 0) toastEl.classList.remove('on'); }
    hudT -= dt;
    if (hudT <= 0) {
      hudT = 0.1;
      hudSteps.textContent = (Math.round(speedLv * 100) / 100).toLocaleString();
      hudCoin.textContent = Math.floor(coins).toLocaleString();
      drawHatchList();
    }
    saveT -= dt;
    if (saveT <= 0) { saveT = 5; saveGame(); }
  }

  // ---------------------------------------------------------------- 更新
  const hudSteps = document.getElementById('hudSteps');
  const hudCoin = document.getElementById('hudCoin');

  let fpsCap = 60;
  let firstPerson = false;
  let fpsAcc = 0, fpsCount = 0;
  let last = performance.now();

  function update(dt) {
    // --- 入力からワールド方向へ
    let ix = input.mx, iy = input.my;
    if (keys['KeyW'] || keys['ArrowUp'])    iy -= 1;
    if (keys['KeyS'] || keys['ArrowDown'])  iy += 1;
    if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
    if (keys['KeyD'] || keys['ArrowRight']) ix += 1;
    let mag = Math.sqrt(ix * ix + iy * iy);
    if (mag > 1) { ix /= mag; iy /= mag; mag = 1; }
    if (stun > 0) { stun -= dt; ix = 0; iy = 0; mag = 0; }

    const fx = -Math.sin(yaw), fz = -Math.cos(yaw);   // 前
    const rx =  Math.cos(yaw), rz = -Math.sin(yaw);   // 右
    const wx = fx * (-iy) + rx * ix;
    const wz = fz * (-iy) + rz * ix;

    // --- はしごに触れているか
    ladderCool = Math.max(0, ladderCool - dt);
    const wasLadder = onLadder;
    onLadder = false;
    curLadder = null;
    if (ladderCool <= 0) {
      const pb0 = playerBox();
      for (let i = 0; i < ladders.length; i++) {
        if (overlap(pb0, ladders[i])) { onLadder = true; curLadder = ladders[i]; break; }
      }
    }
    if (onLadder && !wasLadder) {
      // 近づいた側の面につかまる
      const dx = pos.x - curLadder.cx, dz = pos.z - curLadder.cz;
      if (Math.abs(dx) >= Math.abs(dz)) { ladderFaceX = dx >= 0 ? 1 : -1; ladderFaceZ = 0; }
      else                              { ladderFaceX = 0; ladderFaceZ = dz >= 0 ? 1 : -1; }
    }
    // 地面まで降りて手前に倒したらはしごを離す
    if (onLadder && pos.y < 0.03 && iy > 0.35) {
      onLadder = false; curLadder = null; ladderCool = 0.4;
    }
    if (wasLadder && !onLadder && vel.y > 0) vel.y = Math.min(vel.y, 1.5);
    // 上端付近だけは横に動いて足場へ降りられる
    nearLadderTop = onLadder && (pos.y > curLadder.top - 1.3);

    const target = MOVE_SPEED * runMult() * mag * (onLadder ? (nearLadderTop ? 0.7 : 0) : 1);
    const wlen = Math.sqrt(wx * wx + wz * wz) || 1;
    const desiredX = wx / wlen * target;
    const desiredZ = wz / wlen * target;

    const accel = onGround ? 1 : AIR_CONTROL;
    const smooth = 1 - Math.pow(0.0005, dt * accel);
    vel.x += ((mag > 0.02 ? desiredX : 0) - vel.x) * smooth;
    vel.z += ((mag > 0.02 ? desiredZ : 0) - vel.z) * smooth;

    // --- 上下方向
    onGround = false;
    if (onLadder) {
      vel.y = 0;
      const climb = (-iy) * CLIMB_SPEED;   // スティックを前に倒すと上へ
      moveAxis('y', climb * dt);
    } else {
      vel.y -= GRAVITY * dt;
      if (vel.y < -45) vel.y = -45;
      moveAxis('y', vel.y * dt);
    }
    if (pos.y < 0) { pos.y = 0; vel.y = 0; onGround = true; }
    const prevX = pos.x, prevZ = pos.z;
    moveAxis('x', vel.x * dt);
    moveAxis('z', vel.z * dt);

    // --- ランニング機：乗っているだけで自動で走る（手前に倒すと降りられる）
    runningInPlace = false;
    if (onGround && !onLadder && onTreadmill() && iy < 0.25) {
      pos.x = prevX; pos.z = prevZ;
      vel.x = 0; vel.z = 0;
      runningInPlace = true;
      steps += dt * 3;              // 1秒あたり3歩
      speedTick += dt;
      while (speedTick >= 0.5) {    // 0.5秒ごとに速度が上がる
        speedTick -= 0.5;
        const add = boostMult();
        speedLv += add;
        spawnFloat(pos.x, pos.y + 2.4, pos.z, '👟+' + (add % 1 ? add.toFixed(2) : add));
      }
    }

    // はしごの外面に吸い付かせる
    if (onLadder && !nearLadderTop) {
      const tx = curLadder.cx + ladderFaceX * curLadder.grip;
      const tz = curLadder.cz + ladderFaceZ * curLadder.grip;
      const k = Math.min(1, dt * 9);
      pos.x += (tx - pos.x) * k;
      pos.z += (tz - pos.z) * k;
      vel.x = 0; vel.z = 0;
    }

    // 落下防止（念のため）
    if (pos.y < -30) { pos.set(0, 2, 4); vel.set(0, 0, 0); }

    // --- 向き
    firstPerson = camDist < FP_THRESHOLD;
    if (firstPerson) {
      bodyYaw = yaw;
    } else if (onLadder) {
      const want = Math.atan2(ladderFaceX, ladderFaceZ);
      let diff = want - bodyYaw;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      bodyYaw += diff * Math.min(1, dt * 10);
    } else if (mag > 0.05) {
      const want = Math.atan2(-wx / wlen, -wz / wlen);
      let diff = want - bodyYaw;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      bodyYaw += diff * Math.min(1, dt * 14);
    }
    stepOffset *= Math.pow(0.000004, dt);
    if (stepOffset < 0.002) stepOffset = 0;
    const drawY = pos.y - stepOffset;

    player.position.set(pos.x, drawY, pos.z);
    player.rotation.y = bodyYaw;

    // --- 簡易歩行モーション
    const speed2d = Math.sqrt(vel.x * vel.x + vel.z * vel.z);
    if (runningInPlace) {
      walkPhase += dt * 9;
      const s = Math.sin(walkPhase);
      legL.rotation.x = s * 0.85;  legR.rotation.x = -s * 0.85;
      armL.rotation.x = -s * 0.7;  armR.rotation.x = s * 0.7;
      torso.position.y = 1.15 + Math.abs(Math.cos(walkPhase)) * 0.03;
    } else if (onLadder) {
      walkPhase += dt * (Math.abs(iy) * 6 + 0.6);
      const s = Math.sin(walkPhase);
      armL.rotation.x = -2.5 + s * 0.35;
      armR.rotation.x = -2.5 - s * 0.35;
      legL.rotation.x = -s * 0.5;
      legR.rotation.x = s * 0.5;
    } else if (onGround && speed2d > 0.4) {
      walkPhase += dt * speed2d * 2.4;
      const s = Math.sin(walkPhase);
      legL.rotation.x = s * 0.6;  legR.rotation.x = -s * 0.6;
      armL.rotation.x = -s * 0.5; armR.rotation.x = s * 0.5;
      torso.position.y = 1.15 + Math.abs(Math.cos(walkPhase)) * 0.02;
    } else {
      legL.rotation.x *= 0.8; legR.rotation.x *= 0.8;
      armL.rotation.x = onGround ? armL.rotation.x * 0.8 : 0.7;
      armR.rotation.x = onGround ? armR.rotation.x * 0.8 : 0.7;
    }

    // --- カメラ
    const eye = new THREE.Vector3(pos.x, drawY + EYE_Y, pos.z);
    const cp = Math.cos(pitch);
    const dir = new THREE.Vector3(-Math.sin(yaw) * cp, Math.sin(pitch), -Math.cos(yaw) * cp);

    if (firstPerson) {
      camera.position.copy(eye);
      camera.rotation.set(pitch, yaw, 0);
      player.visible = false;
    } else {
      player.visible = true;
      const want = eye.clone().addScaledVector(dir, -camDist);
      if (want.y < 0.4) want.y = 0.4;
      camera.position.copy(want);
      camera.lookAt(eye);
    }

    gameTick(dt);
  }

  function loop(now) {
    requestAnimationFrame(loop);
    const elapsed = now - last;
    if (elapsed < 1000 / fpsCap - 1.6) return;
    let dt = elapsed / 1000;
    last = now;
    if (dt > 0.1) dt = 0.1;

    update(dt);
    renderer.render(scene, camera);
    if (bootEl && bootEl.parentNode) { bootEl.parentNode.removeChild(bootEl); }

  }
  requestAnimationFrame(loop);

  // ---------------------------------------------------------------- 設定
  const gearEl = document.getElementById('gear');
  const panelEl = document.getElementById('settings');
  const fpsSeg = document.getElementById('fpsSeg');
  const hairChk = document.getElementById('hairOn');
  const landChk = document.getElementById('landOn');
  const musicChk = document.getElementById('musicOn');
  const colorRows = document.getElementById('colorRows');
  const KEY = 'idle-game-settings';

  let conf = { fps: 60, hair: true, land: false, music: true, colors: {} };
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const o = JSON.parse(raw);
      if (o && typeof o === 'object') {
        if (o.fps === 30 || o.fps === 60 || o.fps === 120) conf.fps = o.fps;
        if (typeof o.hair === 'boolean') conf.hair = o.hair;
        if (typeof o.land === 'boolean') conf.land = o.land;
        if (typeof o.music === 'boolean') conf.music = o.music;
        if (o.colors && typeof o.colors === 'object') conf.colors = o.colors;
      }
    }
  } catch (e) {}
  PART_ORDER.forEach(function (k) {
    if (typeof conf.colors[k] !== 'string') conf.colors[k] = PART_DEFAULT[k];
  });

  function saveConf() {
    try { localStorage.setItem(KEY, JSON.stringify(conf)); } catch (e) {}
  }

  // 色の行を作る
  const colorInputs = {};
  PART_ORDER.forEach(function (k) {
    const row = document.createElement('div');
    row.className = 'row';
    const label = document.createElement('span');
    label.textContent = PART_NAME[k];
    const inp = document.createElement('input');
    inp.type = 'color';
    inp.value = conf.colors[k];
    inp.addEventListener('input', function () {
      conf.colors[k] = inp.value;
      bodyMat[k].color.set(inp.value);
      saveConf();
    });
    colorInputs[k] = inp;
    row.appendChild(label);
    row.appendChild(inp);
    colorRows.appendChild(row);
  });

  function applyConf() {
    fpsCap = conf.fps;
    hair.visible = conf.hair;
    hairChk.checked = conf.hair;
    landChk.checked = conf.land;
    musicChk.checked = conf.music;
    musicOnFlag = conf.music;
    if (rotated !== conf.land) { rotated = conf.land; applyStage(); }
    PART_ORDER.forEach(function (k) {
      bodyMat[k].color.set(conf.colors[k]);
      colorInputs[k].value = conf.colors[k];
    });
    const btns = fpsSeg.querySelectorAll('button');
    for (let i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', Number(btns[i].dataset.fps) === conf.fps);
    }
  }

  fpsSeg.addEventListener('click', function (e) {
    const b = e.target.closest('button');
    if (!b) return;
    conf.fps = Number(b.dataset.fps);
    applyConf();
    saveConf();
  });
  hairChk.addEventListener('change', function () {
    conf.hair = hairChk.checked;
    hair.visible = conf.hair;
    saveConf();
  });
  landChk.addEventListener('change', function () {
    conf.land = landChk.checked;
    rotated = conf.land;
    applyStage();
    saveConf();
  });
  musicChk.addEventListener('change', function () {
    conf.music = musicChk.checked;
    musicOnFlag = conf.music;
    saveConf();
  });
  document.getElementById('resetColors').addEventListener('click', function () {
    PART_ORDER.forEach(function (k) { conf.colors[k] = PART_DEFAULT[k]; });
    applyConf();
    saveConf();
  });
  gearEl.addEventListener('click', function () {
    panelEl.classList.toggle('open');
  });

  applyConf();

  // ---------------------------------------------------------------- リサイズ
  function resize() {
    camera.aspect = SW() / SH();
    camera.updateProjectionMatrix();
    renderer.setSize(SW(), SH());
  }
  window.addEventListener('resize', applyStage);
  window.addEventListener('orientationchange', function () { setTimeout(applyStage, 200); });
  applyStage();
})();
</script>
</body>
</html>
