<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>学習アプリ</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#f2f2f2; --card:#fff; --text:#111; --muted:#666;
  --border:#111; --light:#ddd; --accent:#111; --at:#fff;
  --r:14px; --sh:0 2px 12px rgba(0,0,0,.10); --nh:64px;
}
html,body{height:100%;font-family:'Hiragino Kaku Gothic ProN','Meiryo',sans-serif;background:var(--bg);color:var(--text);-webkit-tap-highlight-color:transparent;}

/* ヘッダー */
header{background:var(--accent);color:var(--at);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
header h1{font-size:.95rem;letter-spacing:.05em;}
.hdr-btns{display:flex;gap:6px;}
.hdr-btn{background:transparent;border:1px solid #666;color:#ccc;padding:5px 10px;border-radius:6px;font-size:.72rem;cursor:pointer;min-height:32px;white-space:nowrap;}
.hdr-btn:hover{border-color:#fff;color:#fff;}
.hdr-btn.logged{border-color:#aaa;color:#eee;}

/* メイン */
main{max-width:600px;margin:0 auto;padding:14px 14px calc(var(--nh)+20px);}

/* カード */
.card{background:var(--card);border:1.5px solid var(--light);border-radius:var(--r);box-shadow:var(--sh);padding:20px 16px;margin-bottom:14px;}

/* フィルター */
.sec-label{font-size:.68rem;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;margin-top:10px;}
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.filter-btn{border:1.5px solid #bbb;background:#fff;color:var(--text);padding:5px 12px;border-radius:20px;font-size:.8rem;cursor:pointer;min-height:34px;position:relative;}
.filter-btn.active{background:var(--accent);color:var(--at);border-color:var(--accent);}
.clear-badge{position:absolute;top:-4px;right:-4px;background:#f5a623;color:#fff;border-radius:50%;width:16px;height:16px;font-size:.6rem;display:flex;align-items:center;justify-content:center;}

/* ボトムナビ */
#bottomNav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:#fff;border-top:1px solid var(--light);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:none;background:transparent;color:#aaa;font-family:inherit;padding:6px 2px;}
.nav-item.active{color:var(--text);}
.nav-item .ni{font-size:1.2rem;}
.nav-item .nl{font-size:.58rem;font-weight:bold;}

/* 進捗 */
.prog-line{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-bottom:8px;}
.prog-wrap{height:4px;background:#e5e5e5;border-radius:2px;margin-bottom:16px;}
.prog-bar{height:4px;background:var(--accent);border-radius:2px;transition:width .3s;}

/* 暗記カード */
.flashcard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;}
.fc-tag{font-size:.7rem;border:1px solid var(--light);padding:3px 12px;border-radius:12px;color:var(--muted);}
.fc-q{font-size:1.4rem;font-weight:bold;line-height:1.5;}
.fc-a{font-size:1.1rem;color:var(--muted);border-top:1px solid var(--light);padding-top:14px;width:100%;line-height:1.6;}
.card-img{max-width:100%;border-radius:8px;margin:6px 0;max-height:220px;object-fit:contain;}
.ex-box{margin-top:10px;padding:10px 12px;background:#f5f5f5;border-radius:8px;font-size:.85rem;color:#444;text-align:left;line-height:1.6;width:100%;}
.ex-label{font-size:.7rem;color:#999;display:block;margin-bottom:4px;}
.src-label{font-size:.72rem;color:#aaa;margin-top:8px;text-align:center;}

/* ボタン */
.nav-btns{display:flex;gap:10px;justify-content:center;margin-top:14px;}
.btn{border:2px solid var(--border);background:transparent;color:var(--text);padding:12px 22px;border-radius:var(--r);font-size:.95rem;font-weight:bold;cursor:pointer;min-height:48px;font-family:inherit;}
.btn.primary{background:var(--accent);color:var(--at);border-color:var(--accent);}
.btn.ghost{border-color:#bbb;color:var(--muted);}
.btn:disabled{opacity:.3;cursor:default;}
.btn-full{width:100%;}

/* クイズ */
.quiz-q{font-size:1.2rem;font-weight:bold;text-align:center;margin-bottom:18px;line-height:1.6;}
.quiz-msg{text-align:center;font-size:.95rem;margin-top:12px;font-weight:bold;}
.quiz-msg.ok{color:#111;} .quiz-msg.ng{color:#888;}
.choices{display:flex;flex-direction:column;gap:10px;}
.choice-btn{border:1.5px solid var(--light);background:#fff;color:var(--text);padding:15px 16px;border-radius:var(--r);font-size:.95rem;text-align:left;cursor:pointer;min-height:52px;line-height:1.4;font-family:inherit;width:100%;}
.choice-btn.ok2{border-color:#111;background:#111;color:#fff;}
.choice-btn.ng2{border-color:#ccc;background:#f5f5f5;color:#aaa;text-decoration:line-through;}
.choice-btn:disabled{cursor:default;}
#typingInput{width:100%;border:2px solid var(--light);border-radius:var(--r);padding:14px 16px;font-size:1rem;outline:none;margin-bottom:10px;font-family:inherit;}
#typingInput:focus{border-color:var(--border);}
#typingInput.ok{border-color:#111;background:#f8f8f8;}
#typingInput.ng{border-color:#bbb;}
.hint-txt{font-size:.8rem;color:var(--muted);margin-bottom:10px;}

/* スコア */
.score-wrap{text-align:center;padding:20px 0;}
.score-big{font-size:3.2rem;font-weight:bold;margin:10px 0 4px;}
.score-sub{font-size:.9rem;color:var(--muted);margin-bottom:8px;}
.clear-announce{font-size:1.1rem;font-weight:bold;color:#f5a623;margin-bottom:16px;}

/* 空 */
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:2.8rem;margin-bottom:12px;}

/* 間違い帳 */
.sort-row{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.sort-btn{border:1.5px solid #bbb;background:#fff;color:var(--text);padding:6px 12px;border-radius:20px;font-size:.78rem;cursor:pointer;}
.sort-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.mistake-item{background:#fff;border:1.5px solid var(--light);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.mis-q{font-weight:bold;font-size:.95rem;margin-bottom:4px;}
.mis-a{color:var(--muted);font-size:.85rem;margin-bottom:6px;}
.mis-meta{font-size:.72rem;color:#999;}
.mis-badge{display:inline-block;background:#111;color:#fff;border-radius:20px;padding:2px 10px;font-size:.72rem;margin-right:6px;}
.mis-time-item{font-size:.72rem;color:#aaa;padding:2px 0;border-bottom:1px solid #f0f0f0;}

/* 情報タブ */
.info-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--light);padding-bottom:10px;}
.info-tab{border:none;background:none;font-size:.85rem;padding:6px 14px;border-radius:6px;cursor:pointer;color:var(--muted);font-family:inherit;min-height:36px;}
.info-tab.active{background:var(--accent);color:#fff;}

/* 資料 */
.mat-type-group{margin-bottom:20px;}
.mat-type-label{font-size:.72rem;letter-spacing:.1em;color:var(--muted);border-left:3px solid var(--accent);padding-left:8px;margin-bottom:10px;}
.mat-grade-label{font-size:.72rem;color:#999;margin-bottom:6px;margin-top:8px;}
.material-item{background:#fff;border:1.5px solid var(--light);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.mat-title{font-weight:bold;font-size:.95rem;margin-bottom:4px;}
.mat-meta{font-size:.72rem;color:#999;margin-bottom:8px;}
.mat-content{font-size:.85rem;color:#444;line-height:1.6;margin-bottom:8px;white-space:pre-wrap;}
.mat-img{max-width:100%;border-radius:8px;max-height:300px;object-fit:contain;}
.type-badge{display:inline-block;border:1px solid #ddd;border-radius:12px;padding:2px 8px;font-size:.68rem;color:var(--muted);margin-bottom:8px;}

/* フォーム共通 */
.form-col{display:flex;flex-direction:column;gap:10px;}
.form-col input,.form-col select,.form-col textarea{border:1.5px solid var(--light);border-radius:10px;padding:12px 14px;font-size:.95rem;outline:none;font-family:inherit;min-height:48px;width:100%;}
.form-col input:focus,.form-col select:focus,.form-col textarea:focus{border-color:var(--border);}
.form-col textarea{min-height:80px;resize:none;}
.field-note{font-size:.75rem;color:#e05;margin-top:-4px;margin-left:2px;}
.img-preview{max-width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-top:6px;display:none;}
.img-btn{border:1.5px dashed #bbb;background:#fafafa;color:var(--muted);padding:12px;border-radius:10px;text-align:center;cursor:pointer;font-size:.88rem;width:100%;font-family:inherit;min-height:48px;}
input[type=file]{display:none;}

/* モーダル共通 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;overflow-y:auto;}
.modal-overlay.open{display:flex;align-items:flex-start;justify-content:center;padding:14px;}
.modal-box{background:#fff;border-radius:var(--r);width:100%;max-width:520px;padding:20px 16px;margin-top:12px;}
.modal-box h2{font-size:1rem;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;}
.modal-box h2 button{background:none;border:none;font-size:1.4rem;cursor:pointer;color:#666;padding:4px;}
.modal-tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--light);padding-bottom:10px;flex-wrap:wrap;}
.modal-tab{border:none;background:none;font-size:.82rem;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted);font-family:inherit;min-height:34px;}
.modal-tab.active{background:var(--accent);color:#fff;}
.modal-content{display:none;}
.modal-content.active{display:block;}
.form-err{color:#e05;font-size:.82rem;min-height:20px;text-align:center;}

/* 提案・カード一覧 */
.suggest-list{display:flex;flex-direction:column;gap:10px;}
.sug-item{border:1.5px solid var(--light);border-radius:10px;padding:14px;font-size:.85rem;}
.sug-meta{color:var(--muted);font-size:.75rem;margin-bottom:6px;}
.sug-q{font-weight:bold;margin-bottom:4px;}
.sug-a{color:#444;margin-bottom:4px;}
.sug-src{font-size:.75rem;color:#777;margin-bottom:8px;}
.sug-status{display:inline-block;border-radius:12px;padding:2px 10px;font-size:.72rem;font-weight:bold;}
.sug-status.pending{background:#f5f5f5;color:#888;}
.sug-status.approved{background:#111;color:#fff;}
.sug-status.rejected{background:#ddd;color:#999;}
.sug-actions{display:flex;gap:8px;}
.btn-approve{border:1.5px solid #111;background:#111;color:#fff;padding:8px 16px;border-radius:8px;font-size:.82rem;cursor:pointer;font-family:inherit;}
.btn-reject{border:1.5px solid #bbb;background:none;color:#666;padding:8px 16px;border-radius:8px;font-size:.82rem;cursor:pointer;font-family:inherit;}
.card-list{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;}
.card-list-item{border:1px solid var(--light);border-radius:8px;padding:10px 12px;font-size:.82rem;}
.cl-q{font-weight:bold;margin-bottom:2px;}
.cl-a{color:#555;margin-bottom:2px;}
.cl-tag{font-size:.72rem;color:#999;}
.cl-del{float:right;background:none;border:none;color:#bbb;font-size:1.1rem;cursor:pointer;padding:2px 6px;}

/* 勉強履歴 */
.history-item{border:1px solid var(--light);border-radius:10px;padding:12px;margin-bottom:8px;font-size:.85rem;}
.hist-date{font-size:.72rem;color:#aaa;margin-bottom:4px;}
.hist-subject{font-weight:bold;margin-bottom:2px;}
.hist-score{color:var(--muted);font-size:.82rem;}

#list-subject-filter{border:1px solid #ccc;border-radius:8px;padding:8px 10px;font-size:.85rem;margin-bottom:10px;font-family:inherit;min-height:40px;width:100%;}
</style>
</head>
<body>

<header>
  <h1>📚 学習アプリ</h1>
  <div class="hdr-btns">
    <button id="userBtn" class="hdr-btn" onclick="openAuthOrProfile()">👤 ログイン</button>
    <button id="adminBtn" class="hdr-btn">管理者</button>
  </div>
</header>

<main>
  <div id="filterBar">
    <div class="sec-label">教科</div>
    <div class="filter-row" id="subjectFilter"></div>
    <div class="sec-label">単元</div>
    <div class="filter-row" id="unitFilter"></div>
  </div>
  <div id="studyArea"></div>

  <!-- 間違い帳 -->
  <div id="mistakesArea" style="display:none">
    <div class="sort-row">
      <button class="sort-btn active" onclick="sortMistakes('count')">回数が多い順</button>
      <button class="sort-btn" onclick="sortMistakes('recent')">最近間違えた順</button>
      <button class="sort-btn" onclick="sortMistakes('old')">昔に間違えた順</button>
    </div>
    <div id="mistakeList"></div>
  </div>

  <!-- 資料・提案 -->
  <div id="infoArea" style="display:none">
    <div class="info-tabs">
      <button class="info-tab active" onclick="switchInfoTab('materials')">📁 資料</button>
      <button class="info-tab" onclick="switchInfoTab('suggest')">💡 提案</button>
    </div>
    <div id="infoMaterials"></div>
    <div id="infoSuggest" style="display:none">
      <!-- カード提案 -->
      <div class="card">
        <div class="sec-label" style="margin-bottom:10px">カード追加を提案する</div>
        <div class="form-col">
          <select id="sg-subject"><option value="">教科を選択 *</option></select>
          <input id="sg-unit" placeholder="単元名 *">
          <select id="sg-grade"><option value="中1">中1</option><option value="中2">中2</option><option value="中3" selected>中3</option></select>
          <input id="sg-name" placeholder="提案者名（任意）">
          <input id="sg-question" placeholder="問題文 *">
          <button class="img-btn" onclick="document.getElementById('sg-q-file').click()">📷 問題に画像を追加（任意）</button>
          <input type="file" id="sg-q-file" accept="image/*" onchange="previewImg(this,'sg-q-prev')">
          <img id="sg-q-prev" class="img-preview">
          <input id="sg-answer" placeholder="模範解答 *">
          <button class="img-btn" onclick="document.getElementById('sg-a-file').click()">📷 答えに画像を追加（任意）</button>
          <input type="file" id="sg-a-file" accept="image/*" onchange="previewImg(this,'sg-a-prev')">
          <img id="sg-a-prev" class="img-preview">
          <input id="sg-keywords" placeholder="正解キーワード（タイピング用・読点区切り）">
          <input id="sg-explanation" placeholder="解説（任意）">
          <div class="sec-label" style="margin-top:4px">出典 <span style="color:#e05">*必須</span></div>
          <select id="sg-source-type" onchange="updateSourceFields('sg')">
            <option value="">出典の種類を選択 *</option>
            <option>教科書</option><option>学校ワーク</option><option>塾ワーク</option>
            <option>市販ワーク</option><option>授業プリント</option><option>ノート</option><option>その他</option>
          </select>
          <div id="sg-source-fields"></div>
          <textarea id="sg-note" placeholder="補足・メモ（任意）"></textarea>
          <button class="btn primary btn-full" onclick="submitSuggestion()">提案を送る</button>
          <div id="sg-msg" style="font-size:.85rem;color:#666;min-height:18px;text-align:center"></div>
        </div>
      </div>
      <!-- 資料提案 -->
      <div class="card" style="margin-top:14px">
        <div class="sec-label" style="margin-bottom:10px">資料を提案する</div>
        <div class="form-col">
          <input id="smat-title" placeholder="題名 *">
          <select id="smat-subject"><option value="">教科 *</option></select>
          <input id="smat-unit" placeholder="単元名 *">
          <select id="smat-grade"><option value="中1">中1</option><option value="中2">中2</option><option value="中3" selected>中3</option></select>
          <select id="smat-type"><option value="">種類 *</option><option>授業ノート</option><option>範囲表</option><option>過去問</option><option>授業プリント</option><option>その他</option></select>
          <select id="smat-semester"><option value="">学期 *</option><option>1学期</option><option>2学期</option><option>3学期</option></select>
          <input id="smat-year" type="number" placeholder="西暦 *（例：2026）" min="2020" max="2035">
          <button class="img-btn" onclick="document.getElementById('smat-file').click()">📷 資料の写真（写真か内容文どちらか必須）</button>
          <input type="file" id="smat-file" accept="image/*" onchange="previewImg(this,'smat-prev')">
          <img id="smat-prev" class="img-preview">
          <textarea id="smat-content" placeholder="内容・メモ（写真か内容文どちらか必須）"></textarea>
          <input id="smat-name" placeholder="提案者名（任意）">
          <button class="btn primary btn-full" onclick="submitMaterialSuggestion()">資料を提案する</button>
          <div id="smat-msg" style="font-size:.85rem;color:#666;min-height:18px;text-align:center"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- ボトムナビ -->
<nav id="bottomNav">
  <button class="nav-item active" data-mode="study"><span class="ni">👁</span><span class="nl">暗記</span></button>
  <button class="nav-item" data-mode="choice"><span class="ni">☑</span><span class="nl">選択</span></button>
  <button class="nav-item" data-mode="typing"><span class="ni">✏</span><span class="nl">タイピング</span></button>
  <button class="nav-item" data-mode="mistakes"><span class="ni">❌</span><span class="nl">間違い帳</span></button>
  <button class="nav-item" data-mode="info"><span class="ni">📁</span><span class="nl">資料・提案</span></button>
</nav>

<!-- 認証モーダル -->
<div id="authModal" class="modal-overlay">
  <div class="modal-box">
    <h2>アカウント <button onclick="closeAuth()">✕</button></h2>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchAuthTab('login')">ログイン</button>
      <button class="modal-tab" onclick="switchAuthTab('register')">新規登録</button>
    </div>
    <div class="modal-content active" id="auth-login">
      <div class="form-col">
        <input id="login-email" type="email" placeholder="メールアドレス">
        <input id="login-pw" type="password" placeholder="パスワード" onkeydown="if(event.key==='Enter')doLogin()">
        <div class="form-err" id="login-err"></div>
        <button class="btn primary btn-full" onclick="doLogin()">ログイン</button>
      </div>
    </div>
    <div class="modal-content" id="auth-register">
      <div class="form-col">
        <input id="reg-name" type="text" placeholder="名前（ニックネームOK）*">
        <input id="reg-email" type="email" placeholder="メールアドレス *">
        <input id="reg-pw" type="password" placeholder="パスワード（6文字以上）*">
        <div class="form-err" id="reg-err"></div>
        <button class="btn primary btn-full" onclick="doRegister()">登録する</button>
      </div>
    </div>
  </div>
</div>

<!-- プロフィールモーダル -->
<div id="profileModal" class="modal-overlay">
  <div class="modal-box">
    <h2><span id="profile-name">プロフィール</span> <button onclick="closeProfile()">✕</button></h2>
    <div id="profile-email" style="font-size:.78rem;color:#999;margin-bottom:12px;"></div>
    <div class="info-tabs">
      <button class="info-tab active" onclick="switchProfileTab('history')">📊 勉強履歴</button>
      <button class="info-tab" onclick="switchProfileTab('mysugg')">💡 提案履歴</button>
    </div>
    <div id="profileHistory"></div>
    <div id="profileMysugg" style="display:none"></div>
    <div style="margin-top:16px">
      <button class="btn ghost btn-full" onclick="doLogout()">ログアウト</button>
    </div>
  </div>
</div>

<!-- 管理者ログイン -->
<div id="adminLoginModal" class="modal-overlay">
  <div class="modal-box" style="max-width:320px;text-align:center;">
    <h2>管理者ログイン <button onclick="closeAdminLogin()">✕</button></h2>
    <div class="form-col">
      <input type="password" id="pwInput" placeholder="パスワード" onkeydown="if(event.key==='Enter')checkLogin()">
      <div class="form-err" id="loginError"></div>
      <button class="btn primary btn-full" onclick="checkLogin()">ログイン</button>
      <button class="btn btn-full" onclick="closeAdminLogin()">キャンセル</button>
    </div>
  </div>
</div>

<!-- 管理者パネル -->
<div id="adminPanel" class="modal-overlay">
  <div class="modal-box">
    <h2>管理者パネル <button onclick="closeAdmin()">✕</button></h2>
    <div class="modal-tabs">
      <button class="modal-tab active" onclick="switchAdminTab('add')">カード追加</button>
      <button class="modal-tab" onclick="switchAdminTab('suggest')">提案レビュー</button>
      <button class="modal-tab" onclick="switchAdminTab('list')">カード一覧</button>
      <button class="modal-tab" onclick="switchAdminTab('materials')">資料管理</button>
      <button class="modal-tab" onclick="switchAdminTab('matsugg')">資料提案</button>
    </div>

    <div class="modal-content active" id="tab-add">
      <div class="form-col">
        <select id="add-subject"><option value="">教科 *</option><option>家庭科</option><option>技術</option><option>音楽</option><option>美術</option><option>保健体育</option><option>理科</option><option>社会</option><option>英語</option><option>国語</option></select>

async function doRegister(){

function authErrMsg(code){
  if(code==='auth/email-already-in-use')return 'このメールアドレスは既に使用されています';

  if(code==='auth/weak-password')return 'パスワードが短すぎます（6文字以上）';
  if(code==='auth/user-not-found'||code==='auth/wrong-password'||code==='auth/invalid-credential')return 'メールアドレスまたはパスワードが違います';

// ============================================================
// 画像処理
// ============================================================
async function resizeImage(file,maxW=800){
  return new Promise(resolve=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const scale=Math.min(1,maxW/img.width);
        const canvas=document.createElement('canvas');
        canvas.width=img.width*scale; canvas.height=img.height*scale;
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL('image/jpeg',.65));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}
window.previewImg=function(input,prevId){
  const file=input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{const el=document.getElementById(prevId);el.src=e.target.result;el.style.display='block';};
  reader.readAsDataURL(file);
};
async function getImg(fileInputId){
  const input=document.getElementById(fileInputId);
  if(!input.files[0])return '';
  return await resizeImage(input.files[0]);
}

// ============================================================
// 状態
// ============================================================
let state={mode:'study',subject:null,unit:null,grade:null,filtered:[],index:0,quizIndex:0,score:0,answered:false,mistakeSort:'count'};

// ============================================================
// フィルター
// ============================================================
function buildFilters(){
  const cards=loadCards();
  const subjects=[...new Set(cards.map(c=>c.subject))].filter(Boolean);
  const sf=document.getElementById('subjectFilter');
  sf.innerHTML='<button class="filter-btn active" data-val="">全教科</button>'+
    subjects.map(s=>`<button class="filter-btn" data-val="${s}">${s}</button>`).join('');
  sf.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{
    sf.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); state.subject=b.dataset.val||null; state.unit=null;
    buildUnitFilter(); startSession();
  }));
  buildUnitFilter();
}

function buildUnitFilter(){
  const cards=loadCards();
  const units=[...new Set(cards.filter(c=>!state.subject||c.subject===c.subject).filter(c=>!state.subject||c.subject===state.subject).map(c=>c.unit))].filter(Boolean);
  const uf=document.getElementById('unitFilter');
  uf.innerHTML='<button class="filter-btn active" data-val="">全単元</button>'+
    units.map(u=>{
      // この単元に対応するカードの学年を取得
      const gradeCards=cards.filter(c=>(!state.subject||c.subject===state.subject)&&c.unit===u);
      const grade=gradeCards[0]?.grade||'中3';
      const subject=gradeCards[0]?.subject||state.subject||'';
      const cleared=isClear(subject,u,grade);
      return `<button class="filter-btn" data-val="${u}" data-subject="${subject}" data-grade="${grade}">
        ${u}${cleared?'<span class="clear-badge">🏆</span>':''}
      </button>`;
    }).join('');
  uf.querySelectorAll('.filter-btn').forEach(b=>b.addEventListener('click',()=>{
    uf.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    state.unit=b.dataset.val||null;
    state.grade=b.dataset.grade||null;
    startSession();
  }));
}

function getFiltered(){
  return loadCards().filter(c=>{
    if(state.subject&&c.subject!==state.subject)return false;
    if(state.unit&&c.unit!==state.unit)return false;
    return true;
  });
}

// ============================================================
// セッション
// ============================================================
function startSession(){
  state.filtered=shuffle(getFiltered());
  state.index=0; state.quizIndex=0; state.score=0; state.answered=false;
  renderStudyArea();
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ============================================================
// 描画
// ============================================================
function renderStudyArea(){
  const el=document.getElementById('studyArea');
  if(!state.filtered.length){el.innerHTML=`<div class="empty"><div class="empty-icon">📭</div><div>カードがありません</div></div>`;return;}
  if(state.mode==='study')renderStudy(el);
  else if(state.mode==='choice')renderChoice(el);
  else if(state.mode==='typing')renderTyping(el);
}

// ----- 暗記 -----
function renderStudy(el){
  const cards=state.filtered,i=state.index,c=cards[i];
  const pct=((i+1)/cards.length*100).toFixed(0);
  el.innerHTML=`
    <div class="prog-line"><span>${i+1} / ${cards.length}</span><span>${esc(c.subject)} · ${esc(c.unit)}</span></div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="flashcard">
        <div class="fc-tag">${esc(c.grade)} · ${esc(c.subject)} · ${esc(c.unit)}</div>
        <div class="fc-q">${esc(c.question)}</div>
        ${c.questionImage?`<img src="${c.questionImage}" class="card-img">`:''}
        <div class="fc-a">${esc(c.answer)}</div>
        ${c.answerImage?`<img src="${c.answerImage}" class="card-img">`:''}
        ${c.explanation?`<div class="ex-box"><span class="ex-label">解説</span>${esc(c.explanation)}</div>`:''}
        ${c.source?`<div class="src-label">📖 ${esc(c.source)}</div>`:''}
      </div>
    </div>
    <div class="nav-btns">
      <button class="btn" onclick="studyNav(-1)" ${i===0?'disabled':''}>← 前へ</button>
      <button class="btn" onclick="studyNav(1)" ${i===cards.length-1?'disabled':''}>次へ →</button>
    </div>
    ${i===cards.length-1?`<div style="text-align:center;margin-top:14px"><button class="btn primary" onclick="startSession()">もう一度</button></div>`:''}`;
}
window.studyNav=function(d){state.index=Math.max(0,Math.min(state.filtered.length-1,state.index+d));renderStudy(document.getElementById('studyArea'));};

// ----- 選択クイズ -----
function renderChoice(el){
  const cards=state.filtered;
  if(state.quizIndex>=cards.length){renderScore(el);return;}
  const c=cards[state.quizIndex],choices=makeChoices(c,cards);
  const pct=(state.quizIndex/cards.length*100).toFixed(0);
  el.innerHTML=`
    <div class="prog-line"><span>${state.quizIndex+1} / ${cards.length}</span><span>✓ ${state.score}</span></div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="quiz-q">${esc(c.question)}</div>
      ${c.questionImage?`<img src="${c.questionImage}" class="card-img" style="display:block;margin:0 auto 12px">`:''}
      <div class="choices" id="choicesEl">
        ${choices.map((ch,idx)=>`<button class="choice-btn" onclick="answerChoice(${idx})">${esc(ch)}</button>`).join('')}
      </div>
      <div class="quiz-msg" id="quizMsg"></div>
    </div>
    <div class="nav-btns" id="nextBtnArea" style="display:none">
      <button class="btn primary" onclick="nextQuiz()">次の問題 →</button>
    </div>`;
}
function makeChoices(correct,allCards){
  const pool=allCards.filter(c=>c.id!==correct.id).map(c=>c.answer);
  return shuffle([correct.answer,...shuffle(pool).slice(0,3)]);
}
window.answerChoice=function(idx){
  if(state.answered)return;
  state.answered=true;
  const c=state.filtered[state.quizIndex];
  const btns=document.querySelectorAll('.choice-btn');
  const isCorrect=btns[idx].textContent.trim()===c.answer;
  btns.forEach(b=>{b.disabled=true;if(b.textContent.trim()===c.answer)b.classList.add('ok2');else if(b===btns[idx]&&!isCorrect)b.classList.add('ng2');});
  const msg=document.getElementById('quizMsg');
  if(isCorrect){msg.textContent='✓ 正解！';msg.className='quiz-msg ok';state.score++;}
  else{
    recordMistake(c.id);
    const ex=c.explanation?`<div class="ex-box" style="margin-top:10px"><span class="ex-label">解説</span>${esc(c.explanation)}</div>`:'';
    const src=c.source?`<div class="src-label">📖 ${esc(c.source)}</div>`:'';
    msg.innerHTML=`✗ 不正解　正解：<strong>${esc(c.answer)}</strong>${ex}${src}`;msg.className='quiz-msg ng';
  }
  document.getElementById('nextBtnArea').style.display='flex';
};
window.nextQuiz=function(){state.quizIndex++;state.answered=false;renderChoice(document.getElementById('studyArea'));};

// ----- タイピング -----
function renderTyping(el){
  const cards=state.filtered;
  if(state.quizIndex>=cards.length){renderScore(el);return;}
  const c=cards[state.quizIndex];
  const pct=(state.quizIndex/cards.length*100).toFixed(0);
  el.innerHTML=`
    <div class="prog-line"><span>${state.quizIndex+1} / ${cards.length}</span><span>✓ ${state.score}</span></div>
    <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%"></div></div>
    <div class="card">
      <div class="quiz-q">${esc(c.question)}</div>
      ${c.questionImage?`<img src="${c.questionImage}" class="card-img" style="display:block;margin:0 auto 12px">`:''}
      ${c.hint?`<div class="hint-txt">ヒント：${esc(c.hint)}</div>`:''}
      ${c.keywords?`<div class="hint-txt">※ キーワードを含む文章で答えてください</div>`:''}
      <input type="text" id="typingInput" placeholder="答えを入力…" autocomplete="off" onkeydown="if(event.key==='Enter')checkTyping()">
      <div class="nav-btns">
        <button class="btn primary" onclick="checkTyping()">答え合わせ</button>
        <button class="btn" onclick="skipTyping()">スキップ</button>
      </div>
      <div class="quiz-msg" id="quizMsg"></div>
    </div>
    <div class="nav-btns" id="nextBtnArea" style="display:none">
      <button class="btn primary" onclick="nextQuizTyping()">次の問題 →</button>

window.checkTyping=function(){
  if(state.answered)return;
  const c=state.filtered[state.quizIndex];
  const input=document.getElementById('typingInput');
  if(!input.value.trim())return;
  state.answered=true; input.disabled=true;
  const typed=input.value.trim();
  const norm=s=>s.replace(/[\s　]/g,'').toLowerCase();
  let isCorrect=false;
  if(c.keywords&&c.keywords.trim()){
    const kws=c.keywords.split(/[、,，]/).map(k=>k.trim()).filter(Boolean);
    isCorrect=kws.every(kw=>norm(typed).includes(norm(kw)));
  } else { isCorrect=norm(typed)===norm(c.answer); }
  const ex=c.explanation?`<div class="ex-box" style="margin-top:10px"><span class="ex-label">解説</span>${esc(c.explanation)}</div>`:'';
  const src=c.source?`<div class="src-label">📖 ${esc(c.source)}</div>`:'';
  const msg=document.getElementById('quizMsg');
  if(isCorrect){input.classList.add('ok');msg.innerHTML=`✓ 正解！${ex}${src}`;msg.className='quiz-msg ok';state.score++;}
  else{recordMistake(c.id);input.classList.add('ng');msg.innerHTML=`✗ 不正解　模範解答：<strong>${esc(c.answer)}</strong>${ex}${src}`;msg.className='quiz-msg ng';}
  document.getElementById('nextBtnArea').style.display='flex';
};
window.skipTyping=function(){
  const c=state.filtered[state.quizIndex];
  const input=document.getElementById('typingInput');
  input.disabled=true; state.answered=true;
  const ex=c.explanation?`<div class="ex-box" style="margin-top:10px"><span class="ex-label">解説</span>${esc(c.explanation)}</div>`:'';
  const src=c.source?`<div class="src-label">📖 ${esc(c.source)}</div>`:'';
  document.getElementById('quizMsg').innerHTML=`→ スキップ　模範解答：<strong>${esc(c.answer)}</strong>${ex}${src}`;
  document.getElementById('quizMsg').className='quiz-msg ng';
  document.getElementById('nextBtnArea').style.display='flex';
};

async function renderScore(el){
  const total=state.filtered.length;
  const pct=Math.round(state.score/total*100);
  const msg=pct>=80?'素晴らしい！🎉':pct>=60?'もう少し！💪':'もっと練習しよう📖';

  // 勉強履歴を記録
  await recordStudyHistory(state.subject, state.unit, state.mode, state.score, total);

  // 単元クリア判定：特定単元を選択 & 全問正解
  let clearHtml='';
  if(state.unit && state.score===total && total>0){
    const cards=state.filtered;
    const grade=cards[0]?.grade||'中3';
    const subject=cards[0]?.subject||state.subject||'';
    if(!isClear(subject,state.unit,grade)){
      await recordUnitClear(subject,state.unit,grade);
      clearHtml=`<div class="clear-announce">🏆 「${state.unit}」をクリアしました！</div>`;
    } else {
      clearHtml=`<div style="font-size:.85rem;color:#f5a623;margin-bottom:12px">🏆 クリア済み単元</div>`;
    }
  }

  el.innerHTML=`<div class="card"><div class="score-wrap">
    <div class="sec-label">結果</div>
    <div class="score-big">${state.score} / ${total}</div>
    <div class="score-sub">正答率 ${pct}%　${msg}</div>
    ${clearHtml}
    <button class="btn primary btn-full" onclick="startSession()">もう一度</button>
  </div></div>`;
}

window.sortMistakes=function(type){

function renderMistakes(){
  const mistakes=loadMistakes(),cards=loadCards();
  let items=Object.entries(mistakes).map(([id,times])=>({id,times,card:cards.find(c=>c.id===id)})).filter(x=>x.card);
  if(state.mistakeSort==='count')items.sort((a,b)=>b.times.length-a.times.length);
  else if(state.mistakeSort==='recent')items.sort((a,b)=>Math.max(...b.times)-Math.max(...a.times));
  else items.sort((a,b)=>Math.min(...a.times)-Math.min(...b.times));
  const el=document.getElementById('mistakeList');
  if(!items.length){el.innerHTML=`<div class="empty"><div class="empty-icon">🎉</div><div>間違えた問題はありません！</div></div>`;return;}
  el.innerHTML=items.map(({times,card})=>{
    const sorted=[...times].sort((a,b)=>b-a);
    const timesHtml=sorted.map(t=>{const d=new Date(t);return `<div class="mis-time-item">${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}</div>`;}).join('');
    return `<div class="mistake-item">
      <div class="mis-q">${esc(card.question)}</div>
      <div class="mis-a">答え：${esc(card.answer)}</div>
      <div class="mis-meta">${esc(card.subject)} · ${esc(card.unit)} · ${esc(card.grade)}</div>
      <div style="margin-top:8px">
        <span class="mis-badge">❌ ${times.length}回</span>
        <details style="display:inline"><summary style="font-size:.75rem;color:#aaa;cursor:pointer;display:inline-block;margin-left:6px">日時を見る</summary><div>${timesHtml}</div></details>
      </div></div>`;
  }).join('');
}

function getSourceText(prefix){
  const type=document.getElementById(`${prefix}-source-type`).value;
  if(!type)return null;
  const v=id=>document.getElementById(id)?.value?.trim()||'';
  if(type==='教科書'||type==='学校ワーク'){const p=v(`${prefix}-sp`);if(!p)return null;return `${type} ${p}ページ`;}
  if(type==='塾ワーク'){const cram=v(`${prefix}-scram`),p=v(`${prefix}-sp`);if(!cram||!p)return null;return `塾ワーク（${cram}）${p}ページ`;}
  if(type==='市販ワーク'){const name=v(`${prefix}-sname`),p=v(`${prefix}-sp`);if(!name||!p)return null;return `${name} ${p}ページ`;}
  if(type==='授業プリント'){const name=v(`${prefix}-sname`);if(!name)return null;return `授業プリント「${name}」`;}
  if(type==='ノート'){const d=v(`${prefix}-sdate`);if(!d)return null;return `ノート（${d}）`;}
  if(type==='その他'){const o=v(`${prefix}-sother`);if(!o)return null;return o;}
  return null;
}

      <div class="cl-tag">${esc(m.grade)} · ${esc(m.year)}年 ${esc(m.semester)}</div>
    </div>`).join('')+'</div>';
}
window.deleteMaterial=async function(id){
  if(!confirm('この資料を削除しますか？'))return;
  await saveMaterials(loadMaterials().filter(m=>m.id!==id));
  renderAdminMatList(); renderMaterials();
};

function renderMatSuggList(){
  const list=loadMatSuggs();
  const el=document.getElementById('matSuggList');
  if(!list.length){el.innerHTML='<div style="color:#999;text-align:center;padding:20px;font-size:.85rem">資料提案はまだありません</div>';return;}
  el.innerHTML='<div class="suggest-list">'+list.map(s=>`
    <div class="sug-item">
      <div class="sug-meta">${s.createdAt}　${s.name?'提案者: '+esc(s.name):'匿名'}</div>
      <div class="sug-q">${esc(s.title)}</div>
      <div class="sug-a">${esc(s.subject)} · ${esc(s.unit)} · ${esc(s.grade)} · ${esc(s.type)}</div>
      <div class="sug-src">${esc(s.year)}年 ${esc(s.semester)}</div>
      ${s.content?`<div class="sug-src">${esc(s.content)}</div>`:''}
      ${s.imageUrl?`<img src="${s.imageUrl}" class="card-img">`:''}
      <div class="sug-actions" style="margin-top:8px">
        <button class="btn-approve" onclick="approveMatSugg('${s.id}')">✓ 承認</button>
        <button class="btn-reject" onclick="rejectMatSugg('${s.id}')">✕ 却下</button>
      </div>
    </div>`).join('')+'</div>';
}
window.approveMatSugg=async function(id){
  const list=loadMatSuggs(),s=list.find(x=>x.id===id);if(!s)return;
  const mats=loadMaterials();
  mats.push({id:uid(),title:s.title,subject:s.subject,unit:s.unit,grade:s.grade,type:s.type,semester:s.semester,year:s.year,content:s.content,imageUrl:s.imageUrl,createdAt:new Date().toLocaleString('ja')});
  await saveMaterials(mats);
  await saveMatSuggs(list.filter(x=>x.id!==id));
  renderAdminMatList(); renderMatSuggList(); renderMaterials();
};
window.rejectMatSugg=async function(id){
  if(!confirm('この提案を却下しますか？'))return;
  await saveMatSuggs(loadMatSuggs().filter(x=>x.id!==id));
  renderMatSuggList();
};

// ============================================================
// ナビ切替
// ============================================================
window.switchInfoTab=function(tab){
  document.querySelectorAll('#infoArea .info-tab').forEach((t,i)=>t.classList.toggle('active',['materials','suggest'][i]===tab));
  document.getElementById('infoMaterials').style.display=tab==='materials'?'block':'none';
  document.getElementById('infoSuggest').style.display=tab==='suggest'?'block':'none';
};

document.querySelectorAll('.nav-item').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const mode=btn.dataset.mode;
    state.mode=mode;
    const isStudy=['study','choice','typing'].includes(mode);
    document.getElementById('filterBar').style.display=isStudy?'block':'none';
    document.getElementById('studyArea').style.display=isStudy?'block':'none';
    document.getElementById('mistakesArea').style.display=mode==='mistakes'?'block':'none';
    document.getElementById('infoArea').style.display=mode==='info'?'block':'none';
    if(isStudy)startSession();
    if(mode==='mistakes')renderMistakes();
    if(mode==='info')renderMaterials();
  });
});

// ============================================================
// ユーティリティ
// ============================================================
function esc(str){if(!str)return'';return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ============================================================
// 初期化
// ============================================================
document.getElementById('mistakesArea').style.display='none';
document.getElementById('infoArea').style.display='none';

// 提案フォームの教科セレクト
['sg-subject','smat-subject'].forEach(id=>{
  const el=document.getElementById(id);
  if(el)el.innerHTML='<option value="">教科を選択 *</option>'+SUBJECTS.map(s=>`<option>${s}</option>`).join('');
});

document.getElementById('studyArea').innerHTML=
  '<div class="empty"><div class="empty-icon">⏳</div><div>読み込み中...</div></div>';

onValue(ref(db,'cards'),snap=>{_cards=snap.val()?Object.values(snap.val()):[];buildFilters();startSession();});
onValue(ref(db,'suggestions'),snap=>{_suggestions=snap.val()?Object.values(snap.val()):[];if(document.getElementById('adminPanel').classList.contains('open'))renderSuggestList();});
onValue(ref(db,'materials'),snap=>{_materials=snap.val()?Object.values(snap.val()):[];if(state.mode==='info')renderMaterials();});
onValue(ref(db,'matSuggestions'),snap=>{_matSuggs=snap.val()?Object.values(snap.val()):[];if(document.getElementById('adminPanel').classList.contains('open'))renderMatSuggList();});
</script>
