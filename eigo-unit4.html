<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英語 例文練習｜imagine〜article（41問）</title>
<meta name="description" content="imagine〜articleの41問。実技テストと単語記憶モード。">
<meta name="theme-color" content="#1c2333">
<meta name="format-detection" content="telephone=no">
<meta property="og:type" content="website">
<meta property="og:title" content="英語 例文練習｜imagine〜article（41問）">
<meta property="og:description" content="imagine〜articleの41問。実技テストと単語記憶モード。">
<style>
  :root{
    --ink:#1c2333;
    --paper:#ffffff;
    --rule:#c9d2e0;
    --blank:#2f5d8c;
    --sub:#6b7688;
    --mark:#f0f4fa;
    --ok:#1a7f5a;
    --ng:#c23b41;
    --red:#ff2b2b;
    --en:"Comic Sans MS","Comic Sans","Chalkboard SE","Marker Felt","Comic Neue",cursive;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;padding:20px 16px 90px;background:#eef1f6;color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    line-height:1.7;-webkit-text-size-adjust:100%;
  }
  .sheet{max-width:760px;margin:0 auto;background:var(--paper);padding:24px 20px 40px;border:1px solid var(--rule);}
  header{border-bottom:3px double var(--ink);padding-bottom:14px;}
  h1{font-size:1.3rem;margin:0 0 6px;letter-spacing:.02em;}
  .lead{font-size:.85rem;color:var(--sub);margin:0;}
  button{
    font:inherit;font-size:.85rem;padding:9px 16px;
    background:var(--ink);color:#fff;border:none;border-radius:2px;cursor:pointer;
  }
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink);}
  button:focus-visible{outline:3px solid #f5b301;outline-offset:2px;}
  .screen{display:none;}
  .screen.on{display:block;}

  /* スタート画面 */
  .menu{display:grid;gap:14px;margin:34px 0 10px;}
  .menu button{
    padding:22px 18px;font-size:1.05rem;text-align:left;line-height:1.5;
  }
  .menu button small{display:block;font-size:.78rem;opacity:.75;margin-top:4px;font-weight:normal;}
  .menu button.two{background:#2f5d8c;}

  .tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px;}
  .score{margin:14px 0 20px;padding:10px 14px;background:var(--mark);border-left:5px solid var(--ink);font-size:.95rem;}
  .nav{
    display:none;align-items:center;gap:12px;flex-wrap:wrap;
    margin:16px 0 4px;padding:10px 14px;background:var(--mark);border-left:5px solid var(--blank);
  }
  body.single .nav{display:flex;}
  .progress{font-size:.9rem;color:var(--sub);margin-left:auto;}
  ol.quiz{margin:0;padding:0;list-style:none;}
  li.q{display:grid;grid-template-columns:2.4rem 1fr;gap:0 6px;padding:12px 0;border-bottom:1px dotted var(--rule);}
  body.single li.q{border-bottom:none;padding:20px 0 4px;}
  .num{color:var(--sub);font-size:.9rem;padding-top:.35rem;}
  .en{font-family:var(--en);font-size:1.05rem;line-height:2.4;}
  .ja{grid-column:2;font-size:.82rem;color:var(--sub);margin-top:3px;}
  input.bl{
    font-family:var(--en);font-size:1rem;
    border:none;border-bottom:1.5px solid var(--blank);background:transparent;color:var(--ink);
    padding:2px 4px;margin:0 3px;text-align:center;
  }
  input.bl:focus{outline:none;background:#fdf6dd;border-bottom-width:2.5px;}
  input.bl.ok{color:var(--ok);border-bottom-color:var(--ok);}
  input.bl.ng{color:var(--ng);border-bottom-color:var(--ng);text-decoration:line-through;}
  .fix{font-family:var(--en);color:var(--ok);font-size:.95rem;margin-left:4px;}
  .mark{font-size:1.1rem;margin-left:6px;}
  .mark.ok{color:var(--ok);}
  .mark.ng{color:var(--ng);}
  h2{font-size:1.05rem;margin:40px 0 12px;padding:6px 10px;background:var(--mark);border-left:5px solid var(--ink);}
  .answers{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 18px;
    font-size:.9rem;padding:0;margin:0;list-style:none;
  }
  .answers li{border-bottom:1px dotted var(--rule);padding:4px 0;}
  .answers .an{color:var(--sub);margin-right:6px;font-size:.85rem;}
  .answers b{font-family:var(--en);font-weight:600;}
  .answers .aja{display:block;margin-left:1.6em;font-size:.8rem;color:var(--sub);}

  /* 単語記憶モード */
  .cards{margin:8px 0 0;padding:0;list-style:none;border-top:2px solid var(--ink);}
  .cards li{padding:10px 4px 11px;border-bottom:1px solid var(--rule);}
  .mja{font-size:.84rem;color:#333;margin-bottom:2px;}
  .men{font-family:var(--en);font-size:1.06rem;line-height:1.6;}
  .men .red{color:var(--red);font-weight:bold;}
  .hint{font-size:.8rem;color:var(--sub);margin:10px 0 0;}

  /* 赤シート：下の層で赤成分を消し、上の層で全体を薄くする */
  #redfilter, #redsheet{
    position:fixed;left:12px;top:200px;width:min(92vw,620px);height:190px;
    border-radius:10px;display:none;
  }
  #redfilter{
    background:#ff0000;mix-blend-mode:multiply;
    pointer-events:none;z-index:59;
  }
  #redsheet{
    background:rgba(255,255,255,.45);
    border:1.5px solid rgba(200,60,60,.45);
    box-shadow:0 6px 18px rgba(0,0,0,.18);
    touch-action:none;z-index:60;
  }
  #redfilter.on, #redsheet.on{display:block;}
  #redsheet .resize{
    position:absolute;right:0;bottom:0;width:30px;height:30px;
    background:linear-gradient(135deg,transparent 48%,rgba(150,30,30,.45) 48%,rgba(150,30,30,.45) 60%,transparent 60%,transparent 72%,rgba(150,30,30,.45) 72%,rgba(150,30,30,.45) 84%,transparent 84%);
    border-bottom-right-radius:10px;touch-action:none;cursor:nwse-resize;
  }
  #redsheet .grip{
    position:absolute;left:0;right:0;bottom:6px;text-align:center;
    color:rgba(150,30,30,.55);font-size:.72rem;letter-spacing:.1em;
  }
  .hidden{display:none;}
  @media print{
    body{background:#fff;padding:0;}
    .sheet{border:none;padding:0;max-width:none;}
    .tools,.score,.nav,#redsheet{display:none;}
    li.q{break-inside:avoid;}
    input.bl{border-bottom:1.5px solid #333;}
  }
</style>
</head>
<body>
<div class="sheet">
  <header>
    <h1>英語 例文練習</h1>
    <p class="lead">教科書に出てきた単語・表現（imagine 〜 article・全41問）</p>
  </header>

  <!-- スタート画面 -->
  <section class="screen on" id="start">
    <div class="menu">
      <button id="goTest">実技テスト<small>空所に単語を打ちこんで、最後にまとめて答え合わせ</small></button>
      <button class="two" id="goMemo">単語記憶モード<small>赤シートで単語をかくして覚える</small></button>
    </div>
  </section>

  <!-- 実技テスト -->
  <section class="screen" id="test">
    <div class="tools">
      <button id="check">答え合わせ</button>
      <button class="ghost" id="mode">1問ずつ解く</button>
      <button class="ghost" id="clear">入力を消す</button>
      <button class="ghost" id="shuffle">並べかえ</button>
      <button class="ghost" id="toggle">答えをかくす</button>
      <button class="ghost home">最初の画面へ</button>
    </div>
    <div class="nav">
      <button class="ghost" id="prev">前へ</button>
      <button id="next">次へ</button>
      <span class="progress" id="progress"></span>
    </div>
    <div class="score hidden" id="score"></div>
    <ol class="quiz" id="quiz"></ol>
    <h2 id="ansHead">答え</h2>
    <ol class="answers" id="answers"></ol>
  </section>

  <!-- 単語記憶モード -->
  <section class="screen" id="memo">
    <div class="tools">
      <button id="sheetBtn">赤シートを出す</button>
      <button class="ghost" id="memoShuffle">並べかえ</button>
      <button class="ghost" id="memoOrder">もとの順に</button>
      <button class="ghost home">最初の画面へ</button>
    </div>
    <p class="hint">赤シートは指でドラッグして動かせます。右下のつまみで大きさを変えられます。</p>
    <ul class="cards" id="cards"></ul>
  </section>
</div>

<div id="redfilter"></div>
<div id="redsheet"><span class="grip">◀ ドラッグ ▶</span><div class="resize"></div></div>

<script>
const DATA = [
 ["I just can't {} the world without you.", "imagine", "きみがいない世界なんて想像できないよ。"],
 ["What should I study to become a NASA {}?", "scientist", "NASAの科学者になるには何を勉強すれば？"],
 ["I hope we can keep a good and long {}.", "relationship", "これからもいい関係を続けられるといいね。"],
 ["The story {} was okay but I liked the music.", "itself", "ストーリー自体はまぁまぁだったけど、音楽が気に入ったの。"],
 ["I will not let myself be defeated by any {}.", "injury", "けがになんて負けないぜ。"],
 ["This park offers campground {}.", "facilities", "この公園にはキャンプ場の設備があります。"],
 ["{} people are using social media.", "More and more", "ソーシャルメディアを使う人がどんどん増えています。"],
 ["Please {} the file to my email.", "transfer", "そのファイルを私のメールに転送してください。"],
 ["I met a nice {} woman on the train.", "elderly", "電車でね、すてきなおばあちゃんに会ったの。"],
 ["{} problems are a piece of cake!", "Addition", "足し算の問題は楽勝！"],
 ["It's important to {} a healthy lifestyle.", "maintain", "健康的な生活習慣を維持することが大切です。"],
 ["We've finally got hard {} evidence!", "physical", "ついに確たる物的証拠を手に入れたぜ！"],
 ["A good design should have {}.", "function", "いいデザインは機能的です。"],
 ["Reading books can {} your knowledge.", "widen", "本を読むことで知識を広げることができます。"],
 ["I realized the {} of bread.", "possibilities", "パンの持つ可能性に気づいたの。"],
 ["Is that really {}?", "real", "それってほんとに本物なの？"],
 ["Let's gather more feedback from {}.", "users", "ユーザーの意見をもっと集めよう。"],
 ["He missed school because of an {}.", "illness", "彼、病気で学校を休んだんだって。"],
 ["I can't {} the weather!", "control", "ぼくにも天気は変えられないよ！"],
 ["What does it take to start a {}?", "movement", "運動を起こすには何が必要なんだろう？"],
 ["Watch your {}.", "fingers", "指に気をつけてください。"],
 ["Who {} you here?", "sent", "だれがきみをここに送ってくれたの？"],
 ["That {} is on. — Oh my god.", "microphone", "そのマイク入ってるよ。— うわ最悪。"],
 ["{}, I like watching movies.", "In addition", "そのうえ、映画を見るのも好きです。"],
 ["If you do it {}, it doesn't take much time.", "that way", "そんなふうにやれば、あまり時間かからないよ。"],
 ["I like staying at home. I'm not that {}.", "sociable", "家にいるのが好き。あまり社交的じゃないんだ。"],
 ["{} ate my pudding! — It wasn't me.", "Somebody", "だれかが私のプリン食べた！— ぼくじゃないよ。"],
 ["I felt {} when I couldn't help my friend.", "useless", "友達を助けられなかったとき、自分が役立たずだと感じて。"],
 ["We were {} against the sudden storm.", "helpless", "突然の嵐に対して、私たちはどうすることもできなかった。"],
 ["Maybe ... nobody will {} it.", "notice", "もしかしたら…だれも気づかないかも。"],
 ["They lived {} ever after.", "happily", "彼らはその後幸せに暮らしましたとさ。"],
 ["I'm trying to {} my vocabulary. — Oh, yeah.", "develop", "今ね、語彙を増やそうとしてるの。— そうなんだ。"],
 ["At first, I didn't {} my mistakes.", "recognize", "最初は、自分のまちがいに気づかなかったの。"],
 ["Education has great {} in today's society.", "value", "教育は現代社会で大きな価値を持っています。"],
 ["Thank you for your {}.", "cooperation", "ご協力に感謝いたします。"],
 ["Don't {} too much.", "expect", "そんなに期待しないでね。"],
 ["Nobody is perfect. We're all a little {}.", "imperfect", "だれだって完璧ではない。私たちはみんな少し不完全だ。"],
 ["I learned the {} of never giving up.", "importance", "ぼくは、あきらめないことの大切さを学びました。"],
 ["So let's meet at ten thirty at the station. — {}.", "Okay", "じゃ10時半に駅でね。— わかった。"],
 ["I wish the weather would {} a bit better.", "cooperate", "もうちょっとお天気がよかったらいいのになー。"],
 ["Who wrote this {}? It's wonderful.", "article", "この記事だれが書いたの？すてき。"]
];

const $ = function(id){ return document.getElementById(id); };
const quiz = $('quiz'), answers = $('answers'), scoreBox = $('score');
const progress = $('progress'), ansHead = $('ansHead'), toggleBtn = $('toggle');
const cards = $('cards'), redsheet = $('redsheet'), redfilter = $('redfilter');
let current = [], single = false, idx = 0;

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function slotsOf(a){ return a.split(' / '); }
function answerText(a){
  const s = slotsOf(a);
  return s.every(function(x){ return x === s[0]; }) ? s[0] : s.join(' / ');
}
function norm(s){
  return s.toLowerCase().replace(/[.,!?"'\u2019]/g,'').replace(/\s+/g,' ').trim();
}
function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function fillSlots(en, ans){
  let slots = slotsOf(ans);
  if (slots.length !== en.split('{}').length - 1) slots = new Array(en.split('{}').length - 1).fill(ans);
  return slots;
}

/* ===== 実技テスト ===== */
function inputFor(word){
  const w = Math.max(4, Math.min(11, word.length * 0.95));
  return '<input class="bl" type="text" style="width:' + w + 'em" data-ans="' + esc(word)
       + '" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">';
}
function buildSentence(en, ans){
  const parts = esc(en).split('{}');
  const slots = fillSlots(en, ans);
  let out = parts[0];
  for (let i = 0; i < slots.length; i++){
    out += slots[i].split(' ').map(inputFor).join(' ') + parts[i + 1];
  }
  return out;
}
function renderTest(list){
  current = list; idx = 0;
  scoreBox.classList.add('hidden');
  quiz.innerHTML = list.map(function(item, i){
    return '<li class="q"><span class="num">' + (i + 1) + '.</span>'
         + '<div class="en">' + buildSentence(item[0], item[1]) + '</div>'
         + '<div class="ja">' + esc(item[2]) + '</div></li>';
  }).join('');
  answers.innerHTML = list.map(function(item, i){
    return '<li><span class="an">' + (i + 1) + '.</span><b>' + esc(answerText(item[1])) + '</b>'
         + '<span class="aja">' + esc(item[2]) + '</span></li>';
  }).join('');
  bindKeys();
  applyMode();
}
function bindKeys(){
  const fields = Array.prototype.slice.call(quiz.querySelectorAll('input.bl'));
  fields.forEach(function(f, i){
    f.addEventListener('keydown', function(e){
      if (e.key === 'Enter' && fields[i + 1]) { e.preventDefault(); fields[i + 1].focus(); }
    });
  });
}
function clearMarks(li){
  li.querySelectorAll('.fix, .mark').forEach(function(el){ el.remove(); });
  li.querySelectorAll('input.bl').forEach(function(f){ f.classList.remove('ok','ng'); });
}
function checkAll(){
  let right = 0, blank = 0;
  quiz.querySelectorAll('li.q').forEach(function(li){
    clearMarks(li);
    let allOk = true, allEmpty = true;
    li.querySelectorAll('input.bl').forEach(function(f){
      const ok = norm(f.value) === norm(f.dataset.ans);
      if (f.value.trim() !== '') allEmpty = false;
      f.classList.add(ok ? 'ok' : 'ng');
      if (!ok){
        allOk = false;
        const fix = document.createElement('span');
        fix.className = 'fix';
        fix.textContent = f.dataset.ans;
        f.insertAdjacentElement('afterend', fix);
      }
    });
    const m = document.createElement('span');
    m.className = 'mark ' + (allOk ? 'ok' : 'ng');
    m.textContent = allOk ? '\u25cb' : '\u00d7';
    li.querySelector('.en').appendChild(m);
    if (allOk) right++;
    if (allEmpty) blank++;
  });
  const total = current.length;
  if (single){ single = false; $('mode').textContent = '1問ずつ解く'; applyMode(); }
  scoreBox.classList.remove('hidden');
  scoreBox.textContent = total + '問中 ' + right + '問正解（' + Math.round(right / total * 100) + '％）'
    + (blank ? '　※未入力 ' + blank + '問' : '');
  window.scrollTo({top:0, behavior:'smooth'});
}
function applyMode(){
  const items = quiz.querySelectorAll('li.q');
  document.body.classList.toggle('single', single);
  items.forEach(function(li, i){ li.classList.toggle('hidden', single && i !== idx); });
  if (single){
    progress.textContent = (idx + 1) + ' / ' + current.length;
    const first = items[idx] ? items[idx].querySelector('input.bl') : null;
    if (first) first.focus({preventScroll:true});
  }
}
function move(step){
  idx = Math.min(current.length - 1, Math.max(0, idx + step));
  applyMode();
  window.scrollTo({top:0, behavior:'smooth'});
}
function setAnswersHidden(hide){
  answers.classList.toggle('hidden', hide);
  ansHead.classList.toggle('hidden', hide);
  toggleBtn.textContent = hide ? '答えを表示する' : '答えをかくす';
}

/* ===== 単語記憶モード ===== */
function renderCards(list){
  cards.innerHTML = list.map(function(item){
    const parts = esc(item[0]).split('{}');
    const slots = fillSlots(item[0], item[1]);
    let en = parts[0];
    for (let i = 0; i < slots.length; i++){
      en += '<span class="red">' + esc(slots[i]) + '</span>' + parts[i + 1];
    }
    return '<li><div class="mja">' + esc(item[2]) + '</div><div class="men">' + en + '</div></li>';
  }).join('');
}

/* ===== 赤シート（ドラッグ） ===== */
(function(){
  let dx = 0, dy = 0, dragging = false;
  function place(x, y){
    [redsheet, redfilter].forEach(function(el){
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    });
  }
  function size(w, h){
    [redsheet, redfilter].forEach(function(el){
      el.style.width  = Math.max(90, w) + 'px';
      el.style.height = Math.max(44, h) + 'px';
    });
  }
  redsheet.addEventListener('pointerdown', function(e){
    dragging = true;
    redsheet.setPointerCapture(e.pointerId);
    const r = redsheet.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
  });
  redsheet.addEventListener('pointermove', function(e){
    if (!dragging) return;
    e.preventDefault();
    place(e.clientX - dx, e.clientY - dy);
  });
  ['pointerup','pointercancel'].forEach(function(t){
    redsheet.addEventListener(t, function(){ dragging = false; });
  });

  const handle = redsheet.querySelector('.resize');
  let resizing = false;
  handle.addEventListener('pointerdown', function(e){
    e.stopPropagation();
    resizing = true;
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', function(e){
    if (!resizing) return;
    e.preventDefault();
    const r = redsheet.getBoundingClientRect();
    size(e.clientX - r.left, e.clientY - r.top);
  });
  ['pointerup','pointercancel'].forEach(function(t){
    handle.addEventListener(t, function(){ resizing = false; });
  });
})();

/* ===== 画面切り替え ===== */
function show(id){
  document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('on', s.id === id); });
  if (id !== 'memo'){
    redsheet.classList.remove('on'); redfilter.classList.remove('on');
    $('sheetBtn').textContent = '赤シートを出す';
  }
  window.scrollTo({top:0});
}
$('goTest').addEventListener('click', function(){
  renderTest(shuffle(DATA));
  setAnswersHidden(false);
  show('test');
});
$('goMemo').addEventListener('click', function(){
  renderCards(DATA);
  show('memo');
});
document.querySelectorAll('.home').forEach(function(b){
  b.addEventListener('click', function(){ show('start'); });
});
$('check').addEventListener('click', checkAll);
$('clear').addEventListener('click', function(){
  quiz.querySelectorAll('li.q').forEach(clearMarks);
  quiz.querySelectorAll('input.bl').forEach(function(f){ f.value = ''; });
  scoreBox.classList.add('hidden');
});
$('shuffle').addEventListener('click', function(){
  renderTest(shuffle(DATA));
  window.scrollTo({top:0});
});
$('mode').addEventListener('click', function(){
  single = !single;
  this.textContent = single ? 'まとめて表示' : '1問ずつ解く';
  if (single) setAnswersHidden(true);
  applyMode();
  window.scrollTo({top:0});
});
$('next').addEventListener('click', function(){ move(1); });
$('prev').addEventListener('click', function(){ move(-1); });
toggleBtn.addEventListener('click', function(){
  setAnswersHidden(!answers.classList.contains('hidden'));
});
$('sheetBtn').addEventListener('click', function(){
  const on = redsheet.classList.toggle('on');
  redfilter.classList.toggle('on', on);
  this.textContent = on ? '赤シートをしまう' : '赤シートを出す';
});
$('memoShuffle').addEventListener('click', function(){ renderCards(shuffle(DATA)); window.scrollTo({top:0}); });
$('memoOrder').addEventListener('click', function(){ renderCards(DATA); window.scrollTo({top:0}); });
</script>
</body>
</html>
